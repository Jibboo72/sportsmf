<style>
:root{
  --ink:#0B0B0C;--silver:#B0B7BC;--line:#D9DDE0;--soft:#F4F6F7;--muted:#4E565C;--dim:#6B7378;
  --blue:#0076B6;--blue2:#3A9BDC;--red:#D50A0A;--green:#14A44D;--green-t:#0E8A3E;--green-bg:#E8F6EE;--red-bg:#FDECEC;
  --bg:#FFFFFF;--card:#FFFFFF;--on-ink:#FFFFFF;--court:#E9C9A0;--paint:#DDB487;--courtline:#FFFFFF;--ice:#F4F8FB;--rinkline:#B8C4CE;
  --disp:'Saira Condensed',system-ui,sans-serif;
  --body:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="dark"]{
  --ink:#F1F3F4;--silver:#59616A;--line:#2A2F35;--soft:#191C21;--muted:#A6AEB5;--dim:#8B949B;
  --blue:#3A9BDC;--blue2:#6CB8EA;--red:#FF5252;--green:#22C064;--green-t:#45D98A;--green-bg:#12301F;--red-bg:#3A1717;
  --bg:#0D0F12;--card:#15181D;--on-ink:#0D0F12;--court:#2A2219;--paint:#3A2D1F;--courtline:rgba(255,255,255,.55);--ice:#1A2129;--rinkline:#3C4A57;color-scheme:dark;
}
:root[data-theme="dark"] .sheet .bg{background:rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
main>*{flex-shrink:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
a{color:var(--blue)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top)}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
.logo{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0}
.slashes{display:flex;gap:3px;transform:skewX(-20deg)}
.slashes i{display:block;width:5px;height:26px}
.word{display:flex;transform:skewX(-10deg);position:relative;font:900 28px/1 var(--disp)}

/* ---------- NFL props from the Call Sheet odds file ---------- */
async function csOdds(){
  let last;
  for (const u of CS_ODDS){ try { return await getJSON(u, 30 * 60000); } catch (e){ last = e; } }
  throw last || new Error('Odds file unavailable');
}
const normAbbr = a => ABBR_ALIAS[String(a || '').toUpperCase()] || String(a || '').toUpperCase();
function csGameFor(odds, ev){
  const games = (odds && odds.games) || [];
  const h = normAbbr(ev.home.abbr), a = normAbbr(ev.away.abbr);
  const t = new Date(ev.date).getTime();
  return games.find(g => normAbbr(g.home) === h && normAbbr(g.away) === a && Math.abs(new Date(g.start).getTime() - t) < 2 * 864e5) || null;
}
function playerName(id){
  const words = String(id || '').replace(/_\d+_[A-Z]+$/, '').split('_').filter(Boolean);
  return words.map(w => /^(II|III|IV)$/.test(w) ? w : w === 'JR' ? 'Jr.' : w === 'SR' ? 'Sr.' : w.length <= 2 ? w : w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
}
const toDec = o => { o = parseInt(o, 10); return !o ? 0 : o > 0 ? 1 + o / 100 : 1 + 100 / Math.abs(o); };
function bestPrice(p){
  let best = null;
  Object.entries(p.books || {}).forEach(([k, v]) => {
    if (!v || v.odds === null || v.odds === undefined) return;
    if (v.line !== null && v.line !== undefined && +v.line !== +p.line) return;
    if (!best || toDec(v.odds) > toDec(best.odds)) best = {odds: v.odds, book: BOOK_MAP[k] || k};
  });
  return best || (p.odds ? {odds: p.odds, book: ''} : null);
}
function propRows(game, mkt){
  const rows = new Map();
  (game.props || []).filter(p => p.market === mkt && p.player).forEach(p => {
    if (YESNO.test(mkt) && p.side !== 'over') return;
    const key = p.player + '|' + p.line;
    const r = rows.get(key) || {player: p.player, name: playerName(p.player), line: p.line};
    r[p.side] = bestPrice(p);
    rows.set(key, r);
  });
  const list = [...rows.values()];
  if (YESNO.test(mkt)) return list.sort((a, b) => toDec(a.over && a.over.odds) - toDec(b.over && b.over.odds));
  return list.sort((a, b) => (+b.line || 0) - (+a.line || 0) || a.name.localeCompare(b.name));
}
function propsTab(d, ev, p, room){
  if (d.oddsErr) return `<div class="empty">Couldn't reach your Call Sheet odds file.<br><small>${esc(d.oddsErr)}</small></div>`;
  const g = d.csGame;
  if (!g || !(g.props || []).length) return '<div class="empty">No props in your Call Sheet odds pull for this game yet.</div>';
  const have = [...new Set(g.props.filter(x => x.player).map(x => x.market))];
  /* Your Call Sheet card picks for players in this game. */
  const inGame = new Set(g.props.filter(x => x.player).map(x => nameKey(playerName(x.player))));
  const gamePicks = csPicks().filter(pk => inGame.has(pk.key));
  gamePicks.forEach(pk => { if (pk.mkt && !have.includes(pk.mkt)) have.push(pk.mkt); });
  const pickCount = k => gamePicks.filter(pk => pk.mkt === k).length;
  const order = Object.keys(MARKETS).filter(k => have.includes(k)).concat(have.filter(k => !MARKETS[k]));
  const firstPicked = order.find(k => pickCount(k));
  const mkt = have.includes(p.mkt) ? p.mkt : (firstPicked || (have.includes('receiving_receptions') ? 'receiving_receptions' : order[0]));
  const yn = YESNO.test(mkt);
  const rows = propRows(g, mkt);
  rows.forEach(r => { r.key = nameKey(r.name); });
  gamePicks.filter(pk => pk.mkt === mkt).forEach(pk => {
    const side = pk.side === 'under' ? 'under' : 'over';
    const line = pk.side === 'atleast' ? Number(pk.line) - 0.5 : Number(pk.line);
    const hit = rows.find(r => r.key === pk.key && (yn || +r.line === line));
    if (hit){ hit.pick = pk; hit.pickSide = side; return; }
    const syn = {player: pk.who, name: pk.who, key: pk.key, line, pick: pk, pickSide: side};
    syn[side] = pk.odds ? {odds: pk.odds, book: pk.book || 'Call Sheet'} : null;
    rows.push(syn);
  });
  rows.sort((a, b) => (b.pick ? 1 : 0) - (a.pick ? 1 : 0));
  const summary = gamePicks.length ? (() => {
    const by = {};
    gamePicks.forEach(pk => { by[pk.card] = (by[pk.card] || 0) + 1; });
    return `<div style="font:700 14px var(--body);color:var(--green-t)">★ ${gamePicks.length} Call Sheet pick${gamePicks.length > 1 ? 's' : ''} here · ${esc(Object.entries(by).map(([c, n]) => c + (n > 1 ? ' ' + n : '')).join(' · '))}</div>`;
  })() : '';
  const per = perPage(room + 150, gamePicks.length ? 165 : 140, 64, 2);
  const pg = slicePage(rows, per, p.page);
  const label = MARKETS[mkt] || mkt;
  const btn = (r, side) => {
    const pr = r[side];
    if (!pr) return '<span></span>';
    const desc = yn ? `${r.name} ${label}` : `${r.name} ${side === 'over' ? 'Over' : 'Under'} ${r.line} ${label}`;
    return `<button class="chip" style="height:44px;display:flex;flex-direction:column;justify-content:center;line-height:1.1;padding:0 10px" data-h="${h(() => {
      const f = defaultForm(ev); const o = parseInt(pr.odds, 10);
      Object.assign(f, {type:'prop', prop: desc, oddsAbs: String(Math.abs(o) || ''), oddsNeg: o < 0, book: BOOKS.includes(pr.book) ? pr.book : f.book});
      go('addbet', {step:'form', lg: ev.lg, ev, f});
    })}"><b style="font-size:15px">${yn ? 'YES' : side === 'over' ? 'O' : 'U'} ${fmtOdds(pr.odds)}</b><small style="font:600 11px var(--body);color:inherit;opacity:.75">${esc(pr.book)}</small></button>`;
  };
  const pickTag = r => {
    const pk = r.pick;
    const res = pk.grade === 'W' ? ' · WON' : pk.grade === 'L' ? ' · LOST' : pk.grade === 'P' ? ' · PUSH' : pk.placed ? ' · BET PLACED' : '';
    const sideTxt = yn ? '' : ' · ' + (pk.side === 'atleast' ? pk.line + '+' : (pk.side === 'under' ? 'U ' : 'O ') + pk.line);
    return `<span style="font:700 13px var(--body);color:var(--green-t);letter-spacing:.3px">★ ${esc(pk.card.toUpperCase())}${esc(sideTxt)}${esc(res)}</span>`;
  };
  const rowHtml = r => `<div class="lrow" style="padding:8px ${r.pick ? '10px' : '2px'};${r.pick ? 'background:var(--green-bg);border-radius:12px;border-bottom-color:transparent;margin-bottom:4px' : ''}"><span class="main"><span style="font:700 17px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.name)}</span>${r.pick ? pickTag(r) : (yn ? '' : `<span class="sub">Line ${esc(r.line)}</span>`)}</span><span style="display:flex;gap:6px">${btn(r, 'over')}${yn ? '' : btn(r, 'under')}</span></div>`;
  return `${summary}<div class="row" style="gap:8px"><select id="mktSel" aria-label="Prop market" style="flex:1">${order.map(k => `<option value="${esc(k)}" ${k === mkt ? 'selected' : ''}>${esc(MARKETS[k] || k)}${pickCount(k) ? '  ★' + pickCount(k) : ''}</option>`).join('')}</select></div>
    <div>${pg.items.length ? pg.items.map(rowHtml).join('') : '<div class="empty">No lines in this market.</div>'}</div>
    ${pager(pg.page, pg.pages, n => setP({page: n}))}
    <div class="sub">Best price across books · from your Call Sheet pull ${esc(ago(d.csPulled))}</div>`;
}

/* ---------- NHL props from your Scoresheet board ----------
   Same rules as the Scoresheet's Tonight page: "likely" plays are the ones
   it marks likely; "edge" is EV of 5% or more at max_price or shorter;
   30%+ EV is flagged as too good to trust without a check. */
const SS_BOARD = ['/scoresheet/data/board.json', 'https://raw.githubusercontent.com/Jibboo72/scoresheet/main/docs/data/board.json'];
const NHL_ALIAS = {TB:'TBL', NJ:'NJD', SJ:'SJS', LA:'LAK', UTAH:'UTA', UTH:'UTA', MON:'MTL', WAS:'WSH', CLB:'CBJ', NAS:'NSH', VEG:'VGK'};
const nhlAbbr = a => NHL_ALIAS[String(a || '').toUpperCase()] || String(a || '').toUpperCase();
const SS_BOOKS = {'Hard Rock Bet':'Hard Rock', 'theScore Bet':'theScore', 'ESPN BET':'ESPN BET'};
async function ssBoard(){
  let last;
  for (const u of SS_BOARD){ try { return await getJSON(u, 10 * 60000); } catch (e){ last = e; } }
  throw last || new Error('Scoresheet board unavailable');
}
function ssGameFor(board, ev){
  const h = nhlAbbr(ev.home.abbr), a = nhlAbbr(ev.away.abbr), t = new Date(ev.date).getTime();
  return ((board && board.games) || []).find(g => nhlAbbr(g.home) === h && nhlAbbr(g.away) === a && Math.abs(new Date(g.start).getTime() - t) < 864e5) || null;
}
function nhlPropsTab(d, ev, p, room){
  if (d.ssErr) return `<div class="empty">Couldn't reach your Scoresheet board.<br><small>${esc(d.ssErr)}</small></div>`;
  const B = d.ss, g = d.ssGame;
  if (!B || !g) return '<div class="empty">This game isn\'t on your Scoresheet board. The board only covers today\'s slate.</div>';
  const mkt = ['goal', 'assist', 'sog'].includes(p.mkt) ? p.mkt : 'goal';
  const players = (B.players || []).filter(x => String(x.game_id) === String(g.id));
  const max = B.max_price || 750;
  const kind = m => !m ? '' : m.likely ? 'likely' : (m.ev !== null && m.ev !== undefined && m.ev >= 0.30) ? 'flag' : (m.ev >= 0.05 && m.price <= max) ? 'edge' : '';
  const picks = players.flatMap(x => ['goal', 'assist'].map(k => ({x, k, kd: kind(x[k])}))).filter(r => r.kd);
  const cnt = k => picks.filter(r => r.kd === k).length;
  let rows;
  if (mkt === 'sog') rows = players.slice().sort((a, b) => (b.sog || 0) - (a.sog || 0)).map(x => ({x}));
  else {
    const rank = {likely: 0, edge: 1, flag: 3, '': 3};
    rows = players.filter(x => x[mkt]).map(x => ({x, m: x[mkt], kd: kind(x[mkt])}))
      .sort((a, b) => rank[a.kd] - rank[b.kd] || (a.kd === 'likely' || a.kd === 'edge' ? (b.m.ev || 0) - (a.m.ev || 0) : (b.m.p || 0) - (a.m.p || 0)));
  }
  const lastName = n => String(n || '?').split(' ').slice(-1)[0];
  const goalies = B.goalies ? `G: ${lastName(B.goalies[g.away])} ${g.away} · ${lastName(B.goalies[g.home])} ${g.home} (projected)` : '';
  const summary = picks.length
    ? `<div style="font:700 14px var(--body);color:var(--green-t)">★ ${[cnt('likely') ? cnt('likely') + ' likely' : '', cnt('edge') ? cnt('edge') + ' edge' : '', cnt('flag') ? cnt('flag') + ' to check' : ''].filter(Boolean).join(' · ')} from your Scoresheet</div>`
    : '<div class="sub">No Scoresheet plays in this game right now. Passing is a fine bet.</div>';
  const per = perPage(room + 150, 190, 64, 2);
  const pg = slicePage(rows, per, p.page);
  const pct = v => v === null || v === undefined ? '—' : Math.round(v * 100) + '%';
  const tagHtml = r => {
    if (r.kd === 'likely') return `<span style="font:700 13px var(--body);color:var(--green-t)">★ LIKELY · model ${pct(r.m.p)} · fair ${fmtOdds(r.m.fair)}</span>`;
    if (r.kd === 'edge') return `<span style="font:700 13px var(--body);color:var(--green-t)">★ EDGE +${Math.round(r.m.ev * 100)}% · model ${pct(r.m.p)}</span>`;
    if (r.kd === 'flag') return `<span style="font:700 13px var(--body);color:var(--red)">⚠ CHECK +${Math.round(r.m.ev * 100)}% · confirm lineup</span>`;
    return `<span class="sub">${esc(r.x.team)} · model ${pct(r.m.p)} · fair ${fmtOdds(r.m.fair)}</span>`;
  };
  const priceBtn = r => {
    if (!r.m || r.m.price === null || r.m.price === undefined) return '<span class="sub">no price</span>';
    const book = SS_BOOKS[r.m.book] || r.m.book || '';
    const desc = `${r.x.name} ${mkt === 'goal' ? 'anytime goal' : '1+ assist'}`;
    return `<button class="chip" style="height:44px;display:flex;flex-direction:column;justify-content:center;line-height:1.1;padding:0 10px" data-h="${h(() => {
      const f = defaultForm(ev); const o = parseInt(r.m.price, 10);
      Object.assign(f, {type:'prop', prop: desc, oddsAbs: String(Math.abs(o) || ''), oddsNeg: o < 0, book: BOOKS.includes(book) ? book : f.book});
      go('addbet', {step:'form', lg: ev.lg, ev, f});
    })}"><b style="font-size:15px">${fmtOdds(r.m.price)}</b><small style="font:600 11px var(--body);opacity:.75">${esc(book)}</small></button>`;
  };
  const rowHtml = r => {
    if (mkt === 'sog') return `<div class="lrow" style="padding:8px 2px"><span class="main"><span style="font:700 17px var(--body)">${esc(r.x.name)}</span><span class="sub">${esc(r.x.team)} · ${esc(r.x.pos)} · ${esc(r.x.toi)} min TOI</span></span><span class="big" style="font-size:22px">${(+r.x.sog).toFixed(1)} <small style="font:600 12px var(--body);color:var(--muted)">SOG</small></span></div>`;
    const hi = r.kd === 'likely' || r.kd === 'edge';
    return `<div class="lrow" style="padding:8px ${hi ? '10px' : '2px'};${hi ? 'background:var(--green-bg);border-radius:12px;border-bottom-color:transparent;margin-bottom:4px' : ''}"><span class="main"><span style="font:700 17px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.x.name)}</span>${tagHtml(r)}</span>${priceBtn(r)}</div>`;
  };
  const opt = (k, l) => `<option value="${k}" ${k === mkt ? 'selected' : ''}>${l}${k !== 'sog' && picks.some(r => r.k === k) ? '  ★' + picks.filter(r => r.k === k).length : ''}</option>`;
  return `${summary}<div class="row" style="gap:8px"><select id="mktSel" aria-label="Prop market" style="flex:1">${opt('goal', 'Anytime goal')}${opt('assist', '1+ assist')}${opt('sog', 'Shots on goal (projection)')}</select></div>
    <div>${pg.items.length ? pg.items.map(rowHtml).join('') : '<div class="empty">No players in this market.</div>'}</div>
    ${pager(pg.page, pg.pages, n => setP({page: n}))}
    <div class="sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(goalies)}${goalies ? ' · ' : ''}board ${esc(ago(B.generated))}</div>`;
}

/* ---------- MyFantasyLeague ----------
   MFL's API terms forbid calling it with JavaScript from pages outside
   myfantasyleague.com. So a GitHub Action in this repo (mfl_pull.py)
   pulls the league server-side into data/mfl.json, and SportsMF only
   reads that file from its own site. */
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const mflOn = () => !!(S.mfl && S.mfl.franchise);
async function mflSnapshot(fresh){
  const url = new URL('data/mfl.json', location.href).href + '?t=' + (fresh ? Date.now() : Math.floor(Date.now() / 60000));
  const d = await getJSON(url, fresh ? 0 : 60000);
  const fr = {};
  arr(d.league && d.league.franchises).forEach(f => { fr[f.id] = f; });
  return {name: d.league && d.league.name, fr, franchises: arr(d.league && d.league.franchises), week: d.week, matchups: arr(d.matchups).map(arr), players: d.players || {}, stand: arr(d.standings), generated: d.generated};
}
function mflName(pl){ if (!pl) return 'Player'; const n = String(pl.name || ''); const i = n.indexOf(','); return i > 0 ? n.slice(i + 1).trim() + ' ' + n.slice(0, i).trim() : n; }
const fmtPts = v => { const n = parseFloat(v); return isNaN(n) ? '0.0' : n.toFixed(1); };
function myMatchup(snap){
  const me = S.mfl.franchise;
  const m = snap.matchups.find(pair => pair.some(f => f.id === me));
  if (!m) return null;
  return {me: m.find(f => f.id === me), opp: m.find(f => f.id !== me)};
}
function fantasyCard(snap){
  const mm = myMatchup(snap);
  if (!mm || !mm.opp) return '';
  const nm = id => (snap.fr[id] && snap.fr[id].name) || 'Team ' + id;
  const a = parseFloat(mm.me.score) || 0, b = parseFloat(mm.opp.score) || 0;
  const left = (+mm.me.playersYetToPlay || 0) + (+mm.me.playersCurrentlyPlaying || 0);
  const row = (f, mine) => `<div class="tm"><span class="nm" style="${mine ? 'color:var(--blue)' : ''}">${esc(nm(f.id))}</span><span class="sc ${!mine && b < a ? 'lose' : mine && a < b ? 'lose' : ''}">${fmtPts(f.score)}</span></div>`;
  return `<button class="card" data-h="${h(() => go('fantasy', {tab: 'mine'}))}"><div class="meta"><span>FANTASY · WK ${esc(snap.week || '')}</span><span class="r">${left ? (mm.me.playersCurrentlyPlaying > 0 ? '<span class="livec">' + liveDot + esc(mm.me.playersCurrentlyPlaying) + ' playing</span>' : esc(left) + ' to play') : 'Done'}</span></div>${row(mm.me, true)}${row(mm.opp, false)}<div class="foot"><span class="ln">${a >= b ? 'Up' : 'Down'} ${Math.abs(a - b).toFixed(1)} · ${esc(snap.name || 'MFL')}</span><span class="tag ${a >= b ? 'bet' : 'my'}">MY TEAM</span></div></button>`;
}
/* Refresh now: starts the "MFL pull" job on GitHub right away instead of
   waiting for its schedule. Uses a GitHub key saved only on this phone,
   made to do one thing: run Actions in the sportsmf repo. It never goes
   anywhere but api.github.com and is left out of backups. */
const GH = {repo: 'Jibboo72/sportsmf', wf: 'mfl.yml', ref: 'main'};
let mflRef = {state: '', msg: ''};
const wait = ms => new Promise(r => setTimeout(r, ms));
function ghApi(path, opt){
  return fetch('https://api.github.com/repos/' + GH.repo + path, Object.assign({cache: 'no-store', headers: {Authorization: 'Bearer ' + S.ghToken, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}}, opt || {}));
}
function setRef(state, msg){
  mflRef = {state, msg};
  if (cur().name === 'fantasy') render(true);
}
async function refreshMFL(){
  if (!S.ghToken){ go('settings'); return; }
  if (mflRef.state === 'busy') return;
  let before = null;
  try { before = (await mflSnapshot(true)).generated; } catch (e){}
  const t0 = Date.now();
  setRef('busy', 'Starting the update on GitHub…');
  let r;
  try { r = await ghApi(`/actions/workflows/${GH.wf}/dispatches`, {method: 'POST', body: JSON.stringify({ref: GH.ref})}); }
  catch (e){ return setRef('err', "Couldn't reach GitHub. Check your connection."); }
  if (r.status === 401) return setRef('err', 'GitHub didn\'t accept your key. It may have expired. Make a new one in Settings.');
  if (r.status === 403 || r.status === 404) return setRef('err', 'Your key can\'t run this job. It needs the sportsmf repo with Actions: Read and write.');
  if (r.status !== 204) return setRef('err', 'GitHub answered ' + r.status + '. Try again in a minute.');
  setRef('busy', 'Running on GitHub… usually about a minute');
  for (let i = 0; i < 24; i++){
    await wait(10000);
    try {
      const rr = await ghApi(`/actions/workflows/${GH.wf}/runs?event=workflow_dispatch&per_page=1`);
      if (rr.ok){
        const run = ((await rr.json()).workflow_runs || [])[0];
        if (run && new Date(run.created_at).getTime() >= t0 - 60000 && run.status === 'completed'){
          if (run.conclusion !== 'success') return setRef('err', 'The update failed on GitHub. Open Actions › MFL pull to see why.');
          if (mflRef.msg.indexOf('Saved') !== 0) setRef('busy', 'Saved. Waiting for your site to publish it…');
        }
      }
    } catch (e){}
    try {
      const snap = await mflSnapshot(true);
      if (snap.generated && snap.generated !== before){ mem.forEach((v, k) => { if (k.includes('data/mfl.json')) mem.delete(k); }); return setRef('ok', 'Updated just now'); }
    } catch (e){}
  }
  setRef('err', 'Still waiting on GitHub. Pull down in a minute to check.');
}
function ghKeySheet(){
  openSheet(`<h2>Make a refresh key</h2>
    <p class="sub" style="font-size:16px">Takes about two minutes on GitHub. The key can only start jobs in your sportsmf repo.</p>
    <ol style="margin:0;padding-left:22px;font:500 16px/1.5 var(--body);display:flex;flex-direction:column;gap:6px">
      <li>Open <a href="https://github.com/settings/personal-access-tokens/new" target="_blank" rel="noopener">GitHub › New fine-grained token</a> and sign in.</li>
      <li>Name it <b>SportsMF refresh</b>. Pick an expiration (a year is fine).</li>
      <li>Repository access: <b>Only select repositories</b> › <b>sportsmf</b>.</li>
      <li>Permissions › Repository permissions › <b>Actions</b>: <b>Read and write</b>. Leave everything else alone.</li>
      <li>Tap <b>Generate token</b>, copy it, and paste it into Settings here.</li>
    </ol>
    <p class="sub">It's saved only on this phone and isn't included in backups.</p>
    <button class="ghost" id="closeSheetBtn">Close</button>`);
  $('#closeSheetBtn').onclick = closeSheet;
}
const FANTASY_VIEW = {
  async load(p){
    if (!mflOn()) return {setup: true};
    return mflSnapshot();
  },
  build(p, d, avail){
    if (d.setup) return `<h1 class="title">FANTASY</h1><div class="empty">Pick your team to connect your MyFantasyLeague league.<br><br><button class="chip on" data-h="${h(() => go('mflsetup'))}">Set up MFL ›</button></div>`;
    const t = p.tab || 'mine';
    const nm = id => (d.fr[id] && d.fr[id].name) || 'Team ' + id;
    const seg = (k, l) => `<button class="${t === k ? 'on' : ''}" data-h="${h(() => setP({tab: k, page: 0, side: 'me'}))}">${l}</button>`;
    const busy = mflRef.state === 'busy';
    const refBtn = `<button class="chip" ${busy ? 'disabled style="opacity:.6"' : ''} data-h="${h(refreshMFL)}">${busy ? 'Refreshing…' : S.ghToken ? '↻ Refresh' : '↻ Set up refresh'}</button>`;
    let html = `<div class="row"><h1 class="title">FANTASY</h1>${refBtn}</div>
      <div class="upd" style="margin-top:2px;${mflRef.state === 'err' ? 'color:var(--red);font-weight:600' : mflRef.state === 'ok' ? 'color:var(--green-t);font-weight:600' : ''}">Week ${esc(d.week || '')} · data from ${esc(ago(d.generated))}${mflRef.msg ? ' · ' + esc(mflRef.msg) : ''}</div>
      <div class="seg" style="margin-top:6px">${seg('mine', 'MATCHUP')}${seg('all', 'ALL GAMES')}${seg('stand', 'STANDINGS')}</div>`;
    if (t === 'mine'){
      const mm = myMatchup(d);
      if (!mm) return html + '<div class="empty">No matchup for your team this week.</div>';
      const side = p.side === 'opp' && mm.opp ? mm.opp : mm.me;
      const players = arr(side.players).filter(x => x.status === 'starter').sort((a, b) => (parseFloat(b.score) || 0) - (parseFloat(a.score) || 0));
      const per = perPage(avail, 270, 56, 3);
      const pg = slicePage(players, per, p.page);
      const sideChip = (k, f) => f ? `<button class="chip ${((p.side || 'me') === k) ? 'on' : ''}" data-h="${h(() => setP({side: k, page: 0}))}">${esc(nm(f.id))}</button>` : '';
      const a = parseFloat(mm.me.score) || 0, b = mm.opp ? parseFloat(mm.opp.score) || 0 : 0;
      const prow = x => {
        const pl = d.players[x.id];
        const secs = +x.gameSecondsRemaining || 0;
        const st = secs >= 3600 ? 'Yet to play' : secs > 0 ? `<span class="livec">${liveDot}${Math.ceil(secs / 60)} min left</span>` : 'Final';
        return `<div class="lrow" style="padding:8px 2px"><span class="main"><span style="font:700 17px var(--body)">${esc(mflName(pl))}</span><span class="sub">${pl ? esc(pl.position + ' · ' + pl.team) + ' · ' : ''}${st}</span></span><span class="big" style="font-size:22px">${fmtPts(x.score)}</span></div>`;
      };
      return html + `<div class="head" style="grid-template-columns:1fr auto 1fr;border-top:0;padding:10px 0">
          <div class="side"><span class="tn" style="font-size:18px;color:var(--blue)">${esc(nm(mm.me.id))}</span></div>
          <div class="mid"><div class="scr" style="font-size:38px">${fmtPts(a)}–${fmtPts(b)}</div></div>
          <div class="side"><span class="tn" style="font-size:18px">${esc(mm.opp ? nm(mm.opp.id) : 'BYE')}</span></div></div>
        <div class="chips sm" style="margin-top:8px">${sideChip('me', mm.me)}${sideChip('opp', mm.opp)}</div>
        <div style="margin-top:4px">${pg.items.length ? pg.items.map(prow).join('') : '<div class="empty">Starters post once lineups lock.</div>'}</div>
        ${pager(pg.page, pg.pages, n => setP({page: n}))}`;
    }
    if (t === 'all'){
      const per = perPage(avail, 150, 70, 3);
      const pg = slicePage(d.matchups, per, p.page);
      const row = pair => `<div class="lrow" style="flex-direction:column;align-items:stretch;gap:2px;padding:8px 2px">${pair.map(f => `<div class="row"><span style="font:800 19px var(--disp);${f.id === S.mfl.franchise ? 'color:var(--blue)' : ''}">${esc(nm(f.id))}</span><span style="font:900 21px var(--disp)">${fmtPts(f.score)}</span></div>`).join('')}</div>`;
      return html + `<div style="margin-top:6px">${pg.items.map(row).join('')}</div>${pager(pg.page, pg.pages, n => setP({page: n}))}`;
    }
    const rows = (d.stand || []).slice();
    const per = perPage(avail, 150, 44, 4);
    const pg = slicePage(rows, per, p.page);
    const rec = f => [f.h2hw, f.h2hl].concat(+f.h2ht ? [f.h2ht] : []).filter(x => x !== undefined).join('-');
    return html + `<div style="margin-top:6px">${pg.items.map((f, i) => `<div class="lb" style="grid-template-columns:30px 1fr auto auto"><span class="p">${pg.page * per + i + 1}</span><span style="font:800 19px var(--disp);${f.id === S.mfl.franchise ? 'color:var(--blue)' : ''};overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(nm(f.id))}</span><span style="font:700 16px var(--body)">${esc(rec(f))}</span><span class="sub" style="min-width:64px;text-align:right">${esc(f.pf ? fmtPts(f.pf) + ' PF' : '')}</span></div>`).join('') || '<div class="empty">Standings not available.</div>'}</div>${pager(pg.page, pg.pages, n => setP({page: n}))}`;
  }
};
const MFLSETUP_VIEW = {
  async load(){
    try { return {ok: true, snap: await mflSnapshot()}; }
    catch (e){ return {ok: false, err: e.message}; }
  },
  build(p, d){
    const head = `<h1 class="title">FANTASY (MFL)</h1>`;
    if (!d.ok) return head + `<div class="sub" style="margin-top:12px;color:var(--red);font-weight:700">Your league file isn't there yet.</div>
      <div class="sub" style="margin-top:6px">SportsMF reads <b>data/mfl.json</b>, which the "MFL pull" GitHub job in your sportsmf repo creates. Once it has run once (Actions tab → MFL pull → Run workflow), come back here and pick your team.</div>
      <button class="ghost" style="margin-top:14px" data-h="${h(() => render())}">Check again</button>`;
    const sn = d.snap;
    return head + `<div class="sub" style="margin-top:12px;color:var(--green-t);font-weight:700">Found ${esc(sn.name || 'your league')} · updated ${esc(ago(sn.generated))}. Pick your team:</div>
      <div class="chips" style="margin-top:10px">${sn.franchises.map(f => `<button class="chip ${S.mfl.franchise === f.id ? 'on' : ''}" data-h="${h(() => { S.mfl.franchise = f.id; save(); tab('tonight'); })}">${esc(f.name)}</button>`).join('')}</div>
      ${S.mfl.franchise ? `<button class="ghost danger" style="margin-top:14px" data-h="${h(() => { S.mfl.franchise = ''; save(); render(); })}">Disconnect my team</button>` : ''}`;
  }
};

/* ---------- MLB pitch tracker ----------
   Reads MLB's public Stats API, the same feed Gameday runs on. It's
   personal, non-commercial use, which MLB's notice on the feed allows.
   To keep phone data low, a tiny linescore is checked every poll and the
   bigger play-by-play is only re-read when something changed (or every
   45 seconds). If MLB's feed can't be reached, ESPN's plays are shown. */
const MLB_API = 'https://statsapi.mlb.com/api/';

async function mlbGamePk(ev){
  if (MLB_PK[ev.id]) return MLB_PK[ev.id];
  const t = new Date(ev.date);
  const d = await getJSON(`${MLB_API}v1/schedule?sportId=1&startDate=${isoDay(new Date(t - 864e5))}&endDate=${isoDay(new Date(+t + 864e5))}`, 3600e3);
  const games = (d.dates || []).flatMap(x => x.games || []);
  const hit = (mt, et) => { const n = nameKey(mt && mt.name); return !!n && (n === nameKey(et.name) || n.endsWith(nameKey(et.short))); };
  const g = games.filter(x => x.teams && hit(x.teams.home.team, ev.home) && hit(x.teams.away.team, ev.away))
    .sort((x, y) => Math.abs(new Date(x.gameDate) - t) - Math.abs(new Date(y.gameDate) - t))[0];
  if (!g) throw new Error('game not found in MLB\'s schedule');
  return (MLB_PK[ev.id] = g.gamePk);
}
async function mlbData(ev){
  const pk = await mlbGamePk(ev);
  const ls = await getJSON(`${MLB_API}v1/game/${pk}/linescore`, 6000);
  const off = ls.offense || {};
  const key = [ls.currentInning, ls.inningHalf, ls.balls, ls.strikes, ls.outs, off.batter && off.batter.id, ls.teams && ls.teams.home && ls.teams.home.runs, ls.teams && ls.teams.away && ls.teams.away.runs].join('|');
  const c = MLB_PBP[pk];
  let pbp;
  if (c && c.key === key && Date.now() - c.t < 45000) pbp = c.v;
  else { pbp = await getJSON(`${MLB_API}v1/game/${pk}/playByPlay`, 5000); MLB_PBP[pk] = {key, t: Date.now(), v: pbp}; }
  return {pk, ls, plays: pbp.allPlays || []};
}
const pitchesOf = pl => ((pl && pl.playEvents) || []).filter(e => e.isPitch);
const pitchCol = e => { const d = e.details || {}; return d.isInPlay ? 'var(--blue)' : d.isStrike ? 'var(--red)' : 'var(--green)'; };
const pType = e => (e.details && e.details.type && (e.details.type.description || e.details.type.code)) || 'Pitch';
const pVelo = e => e.pitchData && e.pitchData.startSpeed ? (+e.pitchData.startSpeed).toFixed(1) : '';

function zoneSvg(pitches){

  const X = x => cx + x * S, Y = z => (TOP - z) * S;

  const top = zs.length ? zs.reduce((a, d) => a + d.strikeZoneTop, 0) / zs.length : 3.4;
  const bot = zs.length ? zs.reduce((a, d) => a + d.strikeZoneBottom, 0) / zs.length : 1.6;

  let g = `<rect x="${X(-hw)}" y="${Y(top)}" width="${2 * hw * S}" height="${(top - bot) * S}" fill="var(--soft)" stroke="var(--ink)" stroke-width="2"/>`;

  }

/* Ball in play, on a simple field. Gameday's hit coordinates put home

function spraySvg(hd){
  const s = 0.32, hx = 75, hy = 112;
  const P = (ft, deg) => [hx + ft * s * Math.sin(deg * Math.PI / 180), hy - ft * s * Math.cos(deg * Math.PI / 180)];

  g += `<path d="M${hx},${hy} L${inf[0]} L${inf[1]} L${inf[2]} Z" fill="none" stroke="var(--silver)" stroke-width="1.2"/>`;

    const dx = (c.coordX - 125.42) * 2.5, dy = (198.27 - c.coordY) * 2.5;
    const x = hx + dx * s, y = hy - dy * s;

const HIT_EV = ['single', 'double', 'triple', 'home_run'];
const NO_AB = ['walk', 'intent_walk', 'hit_by_pitch', 'sac_fly', 'sac_bunt', 'catcher_interf', 'sac_fly_double_play', 'sac_bunt_double_play'];
function batterLine(plays, id){
  let h = 0, ab = 0; const xb = [];
  plays.forEach(pl => {
    if (!pl.about || !pl.about.isComplete || !pl.matchup || !pl.matchup.batter || pl.matchup.batter.id !== id) return;

    if (!et || NO_AB.includes(et)) { if (et === 'walk' || et === 'intent_walk') xb.push('BB'); return; }

    if (HIT_EV.includes(et)){ h++; if (et !== 'single') xb.push({double: '2B', triple: '3B', home_run: 'HR'}[et]); }

/* ================= BASKETBALL COURT TRACKER =================

}

  return html;
}

  r.worst = wk.filter(c => c.o === 1).sort((a, b) => b.e - a.e)[0] || null;

/* ================= SWEAT BOARD =================

/* ================= PLAYER PAGES =================

const PLAYER_SPAN = {nfl: 70, cfb: 35, nba: 30, cbb: 16, nhl: 30, chk: 40, mlb: 16};

/* [label, how to read it from a box line]: a stat is [category or null, LABEL] or a sum of those */
function playerStatDefs(lg, path){

    ['TDs', [['rushing', 'TD'], ['receiving', 'TD']]], ['Pass yards', [['passing', 'YDS']]], ['Pass TD', [['passing', 'TD']]], ['INT', [['passing', 'INT']]],
    ['Tackles', [['defensive', 'TOT']]], ['Sacks', [['defensive', 'SACKS']]]];
  if (/basketball/.test(path)) return [
    ['Points', [[null, 'PTS']]], ['Rebounds', [[null, 'REB']]], ['Assists', [[null, 'AST']]], ['3PM', [[null, '3PT']]],
    ['PRA', [[null, 'PTS'], [null, 'REB'], [null, 'AST']]], ['P+R', [[null, 'PTS'], [null, 'REB']]], ['P+A', [[null, 'PTS'], [null, 'AST']]],
    ['Steals', [[null, 'STL']]], ['Blocks', [[null, 'BLK']]], ['Minutes', [[null, 'MIN']]]];
  if (/hockey/.test(path)) return [
    ['Shots on goal', [[null, ['SOG', 'S']]]], ['Goals', [[null, 'G']]], ['Assists', [[null, 'A']]], ['Points', [[null, 'G'], [null, 'A']]],
    ['Blocked shots', [[null, 'BS']]], ['Hits', [[null, 'HT']]], ['Saves', [[null, 'SV']]], ['Shots against', [[null, 'SA']]]];
  if (/baseball/.test(path)) return [
    ['Hits', [['batting', 'H']]], ['Home runs', [['batting', 'HR']]], ['RBI', [['batting', 'RBI']]], ['Runs', [['batting', 'R']]], ['Walks', [['batting', 'BB']]],
    ['Strikeouts (P)', [['pitching', 'K']]], ['Hits allowed', [['pitching', 'H']]], ['Earned runs', [['pitching', 'ER']]]];

}
/* the player's line in one game's box score: {CAT.LABEL: value} plus his athlete record */
function playerLine(s, aid, name){
  let ath = null; const vals = {}; let found = false;
  ((s && s.boxscore && s.boxscore.players) || []).forEach(tg => (tg.statistics || []).forEach(c => {
    const up = (c.labels || c.names || []).map(l => String(l).toUpperCase());
    (c.athletes || []).forEach(a => {
      const at = a.athlete || {};
      if (!(aid ? String(at.id) === String(aid) : same(at.displayName, name))) return;
      ath = ath || at; found = true;
      if (a.didNotPlay || !(a.stats || []).length) return;
      up.forEach((l, i) => { vals[(c.name || '') + '.' + l] = a.stats[i]; vals['.' + l] = vals['.' + l] ?? a.stats[i]; });
    });

  return found ? {ath, vals} : null;
}
function readDef(vals, def){
  let tot = 0, any = false;
  for (const [cat, lab] of def){
    const labs = Array.isArray(lab) ? lab : [lab];
    let v;
    for (const l of labs){ v = cat ? vals[cat + '.' + l] : vals['.' + l]; if (v !== undefined) break; }
    if (v === undefined || v === null || v === '' || v === '--') continue;
    const n = parseFloat(String(v).split('-')[0].split(':')[0]);
    if (!isNaN(n)){ tot += n; any = true; }
  }
  return any ? tot : null;
}
/* a bet on this player: which stat and number, so the chart opens on it */
function betStatFor(lg, path, pick){
  const t = ' ' + String(pick || '').toLowerCase() + ' ';
  const map = /football/.test(path) ? [[/rec(eiving)?\s*y(ar)?ds|receiving yards/, 'Rec yards'], [/rush(ing)?\s*\+\s*rec|scrimmage/, 'Rush+rec yds'], [/rush(ing)?\s*y(ar)?ds/, 'Rush yards'], [/pass(ing)?\s*y(ar)?ds/, 'Pass yards'], [/pass(ing)?\s*td/, 'Pass TD'], [/targets?/, 'Targets'], [/long(est)?\s*rec/, 'Long rec'], [/receptions?|\brec\b|catches/, 'Receptions'], [/carries|rush(ing)?\s*att/, 'Carries'], [/anytime|\btd\b|touchdown/, 'TDs']]
    : /basketball/.test(path) ? [[/p\s*\+\s*r\s*\+\s*a|\bpra\b/, 'PRA'], [/p\s*\+\s*r\b/, 'P+R'], [/p\s*\+\s*a\b/, 'P+A'], [/threes?|3pt|3pm|\b3s\b/, '3PM'], [/rebounds?|\breb/, 'Rebounds'], [/assists?|\bast\b/, 'Assists'], [/steals?/, 'Steals'], [/blocks?/, 'Blocks'], [/points?|\bpts\b/, 'Points']]
    : /hockey/.test(path) ? [[/blocked/, 'Blocked shots'], [/\bsog\b|shots/, 'Shots on goal'], [/saves?/, 'Saves'], [/points?|\bpts\b/, 'Points'], [/assists?/, 'Assists'], [/hits?\b/, 'Hits'], [/goals?|anytime|scorer/, 'Goals']]
    : [[/strikeouts?|\bks?\b/, 'Strikeouts (P)'], [/home runs?|\bhr\b/, 'Home runs'], [/\brbi/, 'RBI'], [/runs?\b/, 'Runs'], [/hits?\b/, 'Hits']];

  if ((m = t.match(/(?:^|[^a-z])(?:o|over|u|under)\s*(\d+(?:\.\d+)?)/))) line = +m[1];

}
function playerBets(p){

  const full = String(p.name || '').toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b\.?/g, '').trim();

VIEWS.player = {
  async load(p){
    const lg = LG[p.lg]; if (!lg) throw new Error('Unknown league');
    const end = today(), start = addDays(end, -(PLAYER_SPAN[p.lg] || 30));
    const q = p.lg === 'cfb' ? 'groups=80&limit=1000' : p.lg === 'cbb' ? 'groups=50&limit=1000' : 'limit=1000';
    const evs = (await board(lg, `${start}-${end}`, q, 10 * 60000)).map(e => norm(e, p.lg))
      .filter(e => e.state === 'post' && (String(e.home.id) === String(p.team) || String(e.away.id) === String(p.team)))
      .sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, PLAYER_N[p.lg] || 8);
    const games = [];
    await Promise.allSettled(evs.map(async e => {
      const s = await getJSON(`${BASE}${e.path}/summary?event=${e.id}`, 30 * 60000);
      const ln = playerLine(s, p.aid, p.name);
      const home = String(e.home.id) === String(p.team);
      const me = home ? e.home : e.away, op = home ? e.away : e.home;
      games.push({e, s, ln, home, opp: op, res: me.winner ? 'W' : op.winner ? 'L' : 'T', score: `${me.score}-${op.score}`});
    }));
    games.sort((a, b) => new Date(b.e.date) - new Date(a.e.date));
    const ath = (games.find(g => g.ln && g.ln.ath) || {}).ln?.ath || {};

  },
  navTitle(p){ return esc(p.name || 'Player'); },
  build(p, d){
    const path = (LG[p.lg] && LG[p.lg].path) || '';
    const defs = playerStatDefs(p.lg, path);
    const played = d.games.filter(g => g.ln && Object.keys(g.ln.vals).length);

    const head = at.headshot && at.headshot.href ? `<img class="phead" src="${esc(at.headshot.href)}" alt="" loading="lazy">` : `<span class="phead ph"></span>`;

    if (!played.length) return html + `<div class="empty">No recent games found for ${esc(p.name)}.</div>`;

    const def = (avail.find(a => a[0] === stat) || [])[1];

    const vals = series.map(x => x.v), sorted = vals.slice().sort((a, b) => a - b);

    rows = sa.map(x => ({label: x.label || x.displayName || x.name, a: x.displayValue, h: ((sh.find(y => y.name === x.name) || {}).displayValue) ?? '—'}));
  } else if (sa.length && sa[0].stats){
    sa.forEach((g, gi) => (g.stats || []).forEach((x, i) => { const y = sh[gi] && sh[gi].stats && sh[gi].stats[i]; rows.push({label: (g.name ? g.name.charAt(0).toUpperCase() + g.name.slice(1) + ' ' : '') + (x.abbreviation || x.label || x.name), a: x.displayValue, h: y ? y.displayValue : '—'}); }));
  }
  if (!rows.length) return '';
  return `<div class="tbl"><div class="tr th c4"><span>TEAM STATS</span><span>${esc(ev.away.abbr)}</span><span>${esc(ev.home.abbr)}</span></div>${rows.map(r => `<div class="tr c4"><span>${esc(r.label)}</span><span>${esc(r.a)}</span><span>${esc(r.h)}</span></div>`).join('')}</div>`;
}
/* Player box score. ESPN gives every team sport the same shape: per team,
   stat groups (passing, rushing… / batting, pitching… / skaters, goalies)
   with column labels and one row per player. Football shows the columns
   that matter on a phone; other sports show all and scroll sideways with
   the name pinned. Anyone named in one of your bets on this game is
   starred. */
const FB_ORDER = ['passing', 'rushing', 'receiving', 'defensive', 'interceptions', 'fumbles', 'kicking', 'punting', 'kickReturns', 'puntReturns'];
const FB_COLS = {
  passing: ['C/ATT', 'YDS', 'TD', 'INT', 'QBR'], rushing: ['CAR', 'YDS', 'AVG', 'TD', 'LONG'], receiving: ['REC', 'YDS', 'TD', 'LONG', 'TGTS'],
  defensive: ['TOT', 'SOLO', 'SACKS', 'TFL', 'PD'], interceptions: ['INT', 'YDS', 'TD'], fumbles: ['FUM', 'LOST', 'REC'],
  kicking: ['FG', 'PCT', 'LONG', 'XP', 'PTS'], punting: ['NO', 'YDS', 'AVG', 'IN 20', 'LONG'], kickReturns: ['NO', 'YDS', 'AVG', 'LONG', 'TD'], puntReturns: ['NO', 'YDS', 'AVG', 'LONG', 'TD']
};
const FB_TITLE = {defensive: 'Defense', kickReturns: 'Kick returns', puntReturns: 'Punt returns'};
function betNames(ev){
  const txt = betsFor(ev).map(b => ' ' + String(b.pick || '').toLowerCase() + ' ').join(' ');
  return a => {
    const nm = String((a && a.displayName) || '').toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b\.?/g, '').trim();
    if (!nm || !txt.trim()) return false;
    if (txt.includes(nm)) return true;
    const last = nm.split(' ').filter(Boolean).pop() || '';
    return last.length >= 4 && new RegExp('[^a-z]' + reEsc(last) + '[^a-z]').test(txt);
  };
}
/* Box score names: first initial + last name ("A. St. Brown"), suffixes
   dropped, and cut off at 13 characters so every stat line stays straight. */
const BOX_NAME_W = 118, BOX_NAME_MAX = 13;
function boxName(at){
  const full = String(at.displayName || at.fullName || at.shortName || '').replace(/\s+(jr|sr|ii|iii|iv|v)\.?$/i, '').trim();
  let out = full;
  const w = full.split(' ').filter(Boolean);
  if (w.length >= 2) out = w[0].charAt(0).toUpperCase() + '. ' + w.slice(1).join(' ');
  else if (at.shortName) out = at.shortName;
  return out.length > BOX_NAME_MAX ? out.slice(0, BOX_NAME_MAX - 1).trimEnd() + '…' : out;
}
function playerTables(s, ev, teamId){
  const groups = (s.boxscore && s.boxscore.players) || [];
  const tg = groups.find(g => g.team && String(g.team.id) === String(teamId));
  if (!tg) return '';
  const fb = /football/.test(ev.path || '');
  let cats = (tg.statistics || []).filter(c => (c.athletes || []).length);
  if (fb) cats = cats.slice().sort((a, b) => (FB_ORDER.indexOf(a.name) + 1 || 99) - (FB_ORDER.indexOf(b.name) + 1 || 99));
  const hit = betNames(ev);
  return cats.map(c => {
    const labels = c.labels || c.names || [];
    let idx = labels.map((l, i) => i);
    const up = labels.map(l => String(l).toUpperCase());
    if (fb && FB_COLS[c.name]) idx = FB_COLS[c.name].map(l => up.indexOf(l)).filter(i => i >= 0);
    /* Hockey and basketball: the stats you bet on first, the rest after. */
    const pref = /hockey/.test(ev.path || '') ? (up.includes('SV') ? ['SA', 'GA', 'SV', 'SV%', 'TOI'] : ['G', 'A', 'SOG', '+/-', 'TOI', 'HT', 'BS', 'PIM', 'FW', 'FL', 'FO%'])
      : /basketball/.test(ev.path || '') ? ['PTS', 'REB', 'AST', '3PT', 'FG', 'FT', 'MIN', 'STL', 'BLK', 'TO', 'OREB', 'DREB', 'PF', '+/-'] : null;
    if (pref){
      const hasSog = up.includes('SOG');
      const order = pref.map(l => up.indexOf(l === 'SOG' && !hasSog ? 'S' : l)).filter(i => i >= 0);
      if (order.length >= 3) idx = order;
    }
    const live = (c.athletes || []).filter(a => !a.didNotPlay && (a.stats || []).length);
    const wide = idx.length > 5;
    const colW = i => Math.max(34, Math.round(Math.max(String(labels[i]).length, ...live.map(a => String(a.stats[i] ?? '').length), ...(c.totals ? [String(c.totals[i] ?? '').length] : [])) * 8.6 + 10)) + 'px';
    /* Every row shares one fixed name column, so a long name can't push its
       row's numbers out of line with the rows above and below. */
    const tmpl = `grid-template-columns:${BOX_NAME_W}px ${idx.map(colW).join(' ')}`;
    const title = FB_TITLE[c.name] || c.text || c.displayName || (c.name ? c.name.charAt(0).toUpperCase() + c.name.slice(1) : 'Players');
    const rows = live.map(a => {
      const at = a.athlete || {};
      const star = hit(at);
      const nm = boxName(at);
      const pos = !fb && at.position && at.position.abbreviation ? `<small class="pos">${esc(at.position.abbreviation)}</small>` : '';
      const tap = at.id || at.displayName ? ` role="button" data-h="${h(() => go('player', {lg: ev.lg, aid: at.id, name: at.displayName || nm, team: String(teamId), teamAbbr: (String(ev.home.id) === String(teamId) ? ev.home : ev.away).abbr}))}"` : '';
      return `<div class="pr${star ? ' bet' : ''}"${tap} style="${tmpl}"><span>${star ? '<b style="color:var(--green-t)">★ </b>' : ''}${esc(nm)}${pos}</span>${idx.map(i => `<span>${esc(a.stats[i] ?? '')}</span>`).join('')}</div>`;
    });
    if (!rows.length) return '';
    const tot = (c.totals || []).length && fb && ['passing', 'rushing', 'receiving'].includes(c.name)
      ? `<div class="pr tot" style="${tmpl}"><span>Team</span>${idx.map(i => `<span>${esc(c.totals[i] ?? '')}</span>`).join('')}</div>` : '';
    const body = `<div class="pr ph2" style="${tmpl}"><span>${esc(String(title).toUpperCase())}</span>${idx.map(i => `<span>${esc(labels[i])}</span>`).join('')}</div>${rows.join('')}${tot}`;
    return `<div class="pbx">${wide ? `<div class="sc2 wide">${body}</div>` : body}</div>`;
  }).join('');
}
function boxTab(s, ev, comp, p){
  const ls = lineScore(comp, ev);
  const groups = (s.boxscore && s.boxscore.players) || [];
  const team = teamStatsTable(s, ev);
  if (!groups.length) return (ls + team) || '<div class="empty">Box score shows up once the game starts.</div>';
  const favSide = favOf(ev.away.name, ev.lg) && !favOf(ev.home.name, ev.lg) ? ev.away : ev.home;
  const pick = p.bx === 'team' ? 'team' : (p.bx && [String(ev.away.id), String(ev.home.id)].includes(String(p.bx)) ? String(p.bx) : String(favSide.id));
  const chip = (k, l) => `<button class="chip ${pick === k ? 'on' : ''}" data-h="${h(() => setP({bx: k}))}">${l}</button>`;
  const chips = `<div class="chips sm">${chip(String(ev.away.id), esc(ev.away.abbr || ev.away.short))}${chip(String(ev.home.id), esc(ev.home.abbr || ev.home.short))}${team ? chip('team', 'Team stats') : ''}</div>`;
  const body = pick === 'team' ? team : (playerTables(s, ev, pick) || '<div class="empty">No player stats yet.</div>');
  return `${ls}${chips}${body}`;
}
/* Period names per sport, for section headers. */
function periodName(lg, per){
  if (!per) return '';
  const n = per.number || per;
  const ord = k => k + ((k % 100 >= 11 && k % 100 <= 13) ? 'th' : ({1: 'st', 2: 'nd', 3: 'rd'}[k % 10] || 'th'));
  if (lg === 'mlb') return (per.type ? per.type + ' ' : '') + ord(n);
  if (lg === 'nhl' || lg === 'chk') return n > 3 ? (n === 4 ? 'Overtime' : 'Shootout / ' + ord(n - 3) + ' OT') : ord(n) + ' Period';
  if (lg === 'cbb' || lg === 'soccer') return n > 2 ? (lg === 'soccer' ? 'Extra time' : ord(n - 2) + ' Overtime') : ord(n) + ' Half';
  return n > 4 ? (n === 5 ? 'Overtime' : ord(n - 4) + ' OT') : ord(n) + ' Quarter';
}
function teamOfPlay(x, ev){
  const t = x.team || {};
  const id = String(t.id || '');
  if (id && id === String(ev.home.id)) return ev.home;
  if (id && id === String(ev.away.id)) return ev.away;
  if (t.abbreviation) return same(t.abbreviation, ev.home.abbr) ? ev.home : same(t.abbreviation, ev.away.abbr) ? ev.away : {abbr: t.abbreviation, logo: t.logo};
  return null;
}
/* Every scoring play we can find for the sport: football has a ready
   list; hockey, baseball, basketball and soccer flag them in the play feed. */
function scoringList(s){
  if (s.scoringPlays && s.scoringPlays.length) return s.scoringPlays;
  const plays = (s.plays || []).filter(x => x.scoringPlay);
  if (plays.length) return plays;
  return (s.keyEvents || []).filter(x => x.scoringPlay);
}
function scoringTab(s, ev){
  const list = scoringList(s);
  if (!list.length) return `<div class="empty">${ev.state === 'pre' ? 'Scoring plays show here once the game starts.' : 'No scoring plays yet.'}</div>`;
  const newest = list.slice().reverse();
  let lastPer = null;
  return newest.map(x => {
    const pn = periodName(ev.lg, x.period);
    const hdr = pn !== lastPer ? `<div class="lbl ghdr">${esc(pn)}</div>` : '';
    lastPer = pn;
    const tm2 = teamOfPlay(x, ev);
    const clock = x.clock && x.clock.displayValue ? x.clock.displayValue : '';
    const kind = (x.scoringType && (x.scoringType.displayName || x.scoringType.name)) || (x.type && x.type.text) || '';
    const sc = x.awayScore !== undefined && x.homeScore !== undefined ? `${esc(ev.away.abbr)} ${esc(x.awayScore)} – ${esc(x.homeScore)} ${esc(ev.home.abbr)}` : '';
    return `${hdr}<div class="lrow" style="align-items:flex-start;gap:10px">${tm2 ? logo(tm2.logo) : '<span class="ph"></span>'}<span class="main" style="flex:1"><span class="lbl">${esc([tm2 && tm2.abbr, kind, clock].filter(Boolean).join(' · '))}</span><span style="font:500 16px/1.35 var(--body)">${esc(x.text || '')}</span>${sc ? `<span style="font:800 16px var(--disp);color:var(--muted)">${sc}</span>` : ''}</span></div>`;
  }).join('');
}
function playsTab(s, ev){
  let items = [];
  if (s.plays && s.plays.length){
    items = s.plays.slice(-150).reverse().map(x => ({text: x.text, per: periodName(ev.lg, x.period), clock: x.clock && x.clock.displayValue, scoring: !!x.scoringPlay, team: teamOfPlay(x, ev)}));
  } else if (s.drives && (s.drives.current || s.drives.previous)){
    const drives = (s.drives.previous || []).concat(s.drives.current ? [s.drives.current] : []);
    drives.slice().reverse().forEach(dv => {
      const tm2 = dv.team ? teamOfPlay({team: dv.team}, ev) : null;
      (dv.plays || []).slice().reverse().forEach(x => items.push({text: x.text, per: periodName(ev.lg, x.period), clock: x.clock && x.clock.displayValue, scoring: !!x.scoringPlay, team: tm2}));
    });
  }
  items = items.filter(x => x.text);
  if (!items.length) return '<div class="empty">No plays yet.</div>';
  let lastPer = null;
  return items.map(x => {
    const hdr = x.per !== lastPer ? `<div class="lbl ghdr">${esc(x.per)}</div>` : '';
    lastPer = x.per;
    return `${hdr}<div class="lrow" style="align-items:flex-start;${x.scoring ? 'background:var(--green-bg);border-radius:10px;padding-left:8px;padding-right:8px' : ''}"><span class="main"><span class="lbl">${esc([x.team && x.team.abbr, x.clock].filter(Boolean).join(' · '))}${x.scoring ? ' · <span style="color:var(--green-t)">SCORE</span>' : ''}</span><span style="font:500 16px/1.35 var(--body)">${esc(x.text)}</span></span></div>`;
  }).join('');
}
function gameNewsTab(s, ev, p, room){
  const arts = ((s.news && s.news.articles) || []).filter(realNews);
  if (!arts.length) return '<div class="empty">No stories for this game yet.</div>';
  const per = perPage(room, 90, 86, 2);
  const pg = slicePage(arts, per, p.page);
  return `<div>${pg.items.map(a => newsRow(Object.assign(a, {_label: LG[ev.lg].short}))).join('')}</div>${pager(pg.page, pg.pages, n => setP({page: n}))}`;
}

/* ---------- SPORTS ----------
   Each tile says something: your team's game (live score, tonight's time,
   or the next one this week), how many games are live, or that the sport
   is quiet. Quiet sports drop to the bottom and dim. */
VIEWS.sports = {
  async load(){
    const t = today(), end = addDays(t, 7);
    const info = {};
    await Promise.allSettled(LEAGUES.map(async l => {
      if (l.type !== 'team'){
        const evs = await board(l, t);
        if (evs[0]){
          const st = ((evs[0].status || {}).type || {}).state;
          info[l.key] = {event: evs[0].shortName || evs[0].name, live: st === 'in'};
        }
        return;
      }
      const [day, week] = await Promise.all([board(l, t), board(l, t + '-' + end, null, 300000).catch(() => [])]);
      const n = day.map(e => norm(e, l.key)), w = week.map(e => norm(e, l.key));
      const mine = e => isFav(e);
      const favToday = n.filter(mine).sort(sortEvents)[0];
      const favNext = favToday ? null : w.filter(e => mine(e) && e.state === 'pre' && new Date(e.date) > Date.now()).sort((a, b) => new Date(a.date) - new Date(b.date))[0];
      info[l.key] = {live: n.filter(e => e.state === 'in').length, total: n.length, week: w.length, fav: favToday || favNext || null};
    }));
    return info;
  },
  build(p, info){
    const favLine = (ev) => {
      const f = favOf(ev.home.name, ev.lg) ? ev.home : ev.away, o = f === ev.home ? ev.away : ev.home;
      const vs = (f === ev.home ? 'vs ' : '@ ') + (o.abbr || o.short);
      if (ev.state === 'in') return {cls: 'lv', html: `${liveDot}${esc(f.short)} ${esc(f.score)}–${esc(o.score)} · ${esc(ev.detail)}`};
      if (ev.state === 'post') return {cls: 'fv', html: `${esc(f.short)} ${parseFloat(f.score) > parseFloat(o.score) ? 'W' : parseFloat(f.score) < parseFloat(o.score) ? 'L' : 'T'} ${esc(f.score)}–${esc(o.score)}`};
      const day = ymd(new Date(ev.date)) === today() ? '' : new Date(ev.date).toLocaleDateString(undefined, {weekday: 'short'}) + ' ';
      return {cls: 'fv', html: `${esc(f.short)} · ${esc(day + tm(ev.date))} ${esc(vs)}`};
    };
    const quiet = l => { const c = info[l.key]; return l.type === 'team' ? !(c && (c.total || c.week)) : !(c && c.event); };
    const tile = l => {
      const c = info[l.key] || {};
      const lines = [];
      if (c.fav) lines.push(favLine(c.fav));
      if (l.type === 'team'){
        if (c.live) lines.push({cls: 'lv', html: `${c.fav && c.fav.state === 'in' ? '' : liveDot}${c.live} live${c.total > c.live ? ' · ' + c.total + ' today' : ''}`});
        else if (c.total) lines.push({cls: '', html: `${c.total} game${c.total > 1 ? 's' : ''} today`});
        else if (!c.fav) lines.push({cls: '', html: quiet(l) ? 'No games this week' : 'No games today'});
      } else lines.push(c.event ? {cls: c.live ? 'lv' : '', html: (c.live ? liveDot : '') + esc(c.event)} : {cls: '', html: 'Nothing this week'});
      if (l.sub && lines.length < 2) lines.push({cls: '', html: esc(l.sub)});
      return `<button class="tile ${quiet(l) ? 'off' : ''}" data-h="${h(() => go('league', {lg: l.key, date: today(), mode: 'scores'}))}"><b>${esc(l.name.toUpperCase())}</b>${lines.slice(0, 2).map(x => `<small class="${x.cls}">${x.html}</small>`).join('')}</button>`;
    };
    const order = LEAGUES.filter(l => !quiet(l)).concat(LEAGUES.filter(quiet));
    return `<div class="row" style="margin-top:6px"><h1 class="title">SPORTS</h1></div>
      <div class="grid2" style="margin-top:14px">${order.map(tile).join('')}
      ${DEMO ? '' : `<button class="tile" data-h="${h(() => go('fantasy', {tab: 'mine'}))}"><b>FANTASY</b><small>${S.mfl && S.mfl.franchise ? 'MyFantasyLeague' : 'Connect MFL'}</small></button>`}</div>
      <button class="lrow" style="margin-top:10px" data-h="${h(() => go('myteams'))}"><span class="main"><span style="font:600 17px var(--body)">My teams</span><span class="sub">${esc(S.favs.map(f => f.label || f.name.split(' ').slice(-1)[0]).join(' · '))}</span></span><span style="color:var(--dim);font-size:24px">›</span></button>`;
  }
};

/* ---------- LEAGUE ---------- */
VIEWS.league = {
  async load(p){
    const l = LG[p.lg];
    if (p.mode === 'standings'){
      let q = '';
      if (l.key === 'cfb') q = '?group=' + ((p.conf || 'fbs') === 'fcs' ? 81 : 80);
      else if (!l.college) q = '?level=' + ({div: 3, conf: 2, league: 1}[p.level || 'div']);
      const d = await getJSON(`${STAND}${l.path}/standings${q}`, 300000);
      return {stand: d};
    }
    if (p.mode === 'rankings'){
      const d = await getJSON(`${BASE}${l.path}/rankings`, 600000);
      return {rank: d};
    }
    const ctx = (l.key === 'nfl' || l.key === 'cfb') ? await scoreCtx(l.key) : null;
    if (l.key === 'cfb'){
      const c = CFB[p.conf || 'fbs'];
      const parts = await Promise.all(c.g.map(g => board(l, p.date, `groups=${g}&limit=300`)));
      const seen = new Set();
      return {ctx, evs: parts.flat().filter(e => !seen.has(e.id) && seen.add(e.id))};
    }
    const evs = await board(l, p.date);
    return {ctx, evs};
  },
  build(p, d, avail){
    const l = LG[p.lg];
    const canStand = l.type === 'team' && !l.nostand;
    const mode = p.mode || 'scores';
    let html = p.embed ? '' : `<h1 class="title">${esc(l.name.toUpperCase())}</h1>`;
    const modes = ['scores'].concat(l.rankings ? ['rankings'] : [], canStand ? ['standings'] : []);
    if (modes.length > 1) html += `<div class="seg" style="margin-top:${p.embed ? 0 : 8}px">${modes.map(m => `<button class="${mode === m ? 'on' : ''}" data-h="${h(() => setP({mode: m, page: 0}))}">${m.toUpperCase()}</button>`).join('')}</div>`;
    const room = avail;
    if (l.key === 'cfb' && mode !== 'rankings') html += `<div class="chips sm scrollx" style="margin-top:10px">${CFB_CONF.map(c => `<button class="chip ${(p.conf || 'fbs') === c.k ? 'on' : ''}" data-h="${h(() => setP({conf: c.k}))}">${c.l}</button>`).join('')}</div>`;
    if (mode === 'standings' && !l.college) html += `<div class="chips sm" style="margin-top:10px">${[['div','Division'],['conf', l.key === 'nfl' ? 'Conference' : l.key === 'mlb' ? 'League' : 'Conference'],['league', 'Overall']].map(([k, t]) => `<button class="chip ${(p.level || 'div') === k ? 'on' : ''}" data-h="${h(() => setP({level: k}))}">${t}</button>`).join('')}</div>`;
    if (mode === 'standings') return html + standingsBody(l, d.stand, p, room);
    if (mode === 'rankings') return html + rankingsBody(l, d.rank, p, room);
    if (l.type === 'team'){
      const evs = d.evs.map(e => norm(e, l.key)).sort(sortEvents);
      gradeEvents(evs);
      const per = perPage(room, 130, 79, 2);
      const pg = slicePage(evs, per, p.page);
      return html + `<div style="margin-top:10px">${dateNav(p.date, dt => setP({date: dt, page: 0}))}</div>${p.date === today() && evs.some(e => e.state === 'in') ? `<div style="margin-top:6px;text-align:center">${updLine()}</div>` : ''}
        <div style="margin-top:6px">${pg.items.length ? pg.items.map(ev => gameRow(ev, () => go('game', {lg: ev.lg, path: ev.path, id: ev.id}), d.ctx)).join('') : '<div class="empty">No games on this day.</div>'}</div>
        ${pager(pg.page, pg.pages, n => setP({page: n}))}`;
    }
    if (l.type === 'golf') return html + golfBody(d.evs, p, room);
    if (l.type === 'race') return html + raceBody(d.evs, p, room);
    return html + tennisBody(d.evs, p, room);
  }
};
function golfBody(evs, p, room){
  const ev = evs[0];
  if (!ev) return '<div class="empty">No tournament this week.</div>';
  const comp = (ev.competitions && ev.competitions[0]) || {};
  const st = ((ev.status || comp.status || {}).type) || {};
  const cs = (comp.competitors || []).slice().sort((a, b) => (a.order || 999) - (b.order || 999));
  const per = perPage(room, 120, 46, 4);
  const pg = slicePage(cs, per, p.page);
  const row = c => {
    const pos = (c.status && c.status.position && c.status.position.displayName) || c.order || '';
    const thru = (c.status && (c.status.displayValue || (c.status.thru !== undefined ? 'Thru ' + c.status.thru : ''))) || '';
    return `<div class="lb"><span class="p">${esc(pos)}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.athlete ? c.athlete.displayName : '')}</span><span class="sub">${esc(thru)}</span><span class="s">${esc(scoreVal(c.score))}</span></div>`;
  };
  return `<div class="big" style="margin-top:10px">${esc(ev.name)}</div><div class="sub">${esc(st.detail || st.shortDetail || '')}</div>
    <div style="margin-top:6px">${pg.items.length ? pg.items.map(row).join('') : '<div class="empty">Leaderboard posts once play starts.</div>'}</div>${pager(pg.page, pg.pages, n => setP({page: n}))}`;

function parseSpread(ev){
  const d = ev.odds.details;
  if (!d) return null;
  if (/^(EVEN|PK|PICK)/i.test(d)) return 0;
  const m = String(d).match(/^(\S+)\s+([+-]?\d+(?:\.\d+)?)/);
  if (!m) return null;
  const val = +m[2];
  if (same(m[1], ev.home.abbr)) return val;
  if (same(m[1], ev.away.abbr)) return -val;
  return null;
}
function prefill(f, ev){
  if (f.type === 'spread'){ const hl = parseSpread(ev); if (hl !== null){ const v = f.side === 'away' ? -hl : hl; f.lineAbs = String(Math.abs(v)); f.lineNeg = v < 0; } f.oddsAbs = '110'; f.oddsNeg = true; }
  else if (f.type === 'total'){ if (ev.odds.ou) f.lineAbs = String(ev.odds.ou); f.lineNeg = false; f.oddsAbs = '110'; f.oddsNeg = true; }
  else if (f.type === 'ml'){ const o = f.side === 'away' ? ev.odds.awayML : ev.odds.homeML; if (o !== undefined && o !== null && !isNaN(+o)){ f.oddsAbs = String(Math.abs(+o)); f.oddsNeg = +o < 0; } }
}
function defaultForm(ev){
  const side = favOf(ev.away.name, ev.lg) && !favOf(ev.home.name, ev.lg) ? 'away' : 'home';
  const f = {type:'spread', side, lineAbs:'', lineNeg:false, oddsAbs:'110', oddsNeg:true, book: S.lastBook, units: 1, prop:''};
  prefill(f, ev);
  return f;
}
function syncForm(f){
  const g = id => document.getElementById(id);
  if (g('fLine')) f.lineAbs = g('fLine').value.replace(/[^0-9.]/g, '');
  if (g('fOdds')) f.oddsAbs = g('fOdds').value.replace(/[^0-9]/g, '');
  if (g('fBook')) f.book = g('fBook').value;
  if (g('fProp')) f.prop = g('fProp').value;
  if (g('fUnits')) { const u = parseFloat(g('fUnits').value); if (u > 0) f.units = u; }
}

function nflPowerPage(P, t){
  if (!P || P.err) return `<div class="empty">Your NFL ratings aren't reachable right now.${P && P.err ? '<br><small>' + esc(P.err) + '</small>' : ''}</div>`;
  const ab = normAbbr(t.abbreviation);
  const teams = (P.ratings && P.ratings.teams) || [];
  const me = teams.find(x => normAbbr(x.team) === ab);
  if (!me) return '<div class="empty">This team isn\'t in your NFL ratings yet.</div>';
  const rk = k => 1 + teams.filter(x => (x[k] || 0) > (me[k] || 0)).length;
  const games = ((P.games && P.games.games) || []).filter(g => normAbbr(g.home) === ab || normAbbr(g.away) === ab).sort((a, b) => String(a.date).localeCompare(String(b.date)));
  let w = 0, l = 0, tie = 0, aw = 0, al = 0, ap = 0, mw = 0, ml = 0, mp = 0;
  const rows = games.map(g => {
    const home = normAbbr(g.home) === ab, opp = home ? g.away : g.home;
    const sp = g.spread !== null && g.spread !== undefined ? +g.spread : null;          // home margin the market expects
    const myLine = sp === null ? null : (home ? -sp : sp);                              // betting line for this team
    const mdl = g.proj !== null && g.proj !== undefined ? +g.proj : null;
    const myModel = mdl === null ? null : (home ? -mdl : mdl);
    const lineTxt = v => v === null ? '—' : Math.abs(v) < 0.05 ? 'PK' : (v > 0 ? '+' : '−') + Math.abs(v).toFixed(1);
    let mid, right = '';
    if ('margin' in g){
      const mm = home ? g.margin : -g.margin;
      const me2 = home ? g.hs : g.as, them = home ? g.as : g.hs;
      if (mm > 0) w++; else if (mm < 0) l++; else tie++;
      if (sp !== null){
        const c = mm + myLine;
        if (c > 0) aw++; else if (c < 0) al++; else ap++;
        right = `<span class="tag ${c > 0 ? 'up' : c < 0 ? 'down' : 'even'}">${c > 0 ? 'Covered' : c < 0 ? 'Missed' : 'Push'}</span>`;
        if (mdl !== null && mdl !== sp){
          const res = g.margin - sp, hs2 = mdl > sp;
          if (res === 0) mp++; else if ((hs2 && res > 0) || (!hs2 && res < 0)) mw++; else ml++;
        }
      }
      mid = `<span style="font:800 18px var(--disp);color:${mm > 0 ? 'var(--green-t)' : mm < 0 ? 'var(--red)' : 'var(--muted)'}">${mm > 0 ? 'W' : mm < 0 ? 'L' : 'T'} ${me2}-${them}</span>${right}`;
      right = `line ${lineTxt(myLine)}${myModel !== null ? ' · model ' + lineTxt(myModel) : ''}`;
    } else {
      const edge = myLine !== null && myModel !== null ? Math.abs(myModel - myLine) : null;
      mid = `<span style="font:700 15px var(--body)">Line ${lineTxt(myLine)}</span>${g.total !== null && g.total !== undefined ? `<span class="sub" style="font-weight:700">O/U ${g.total}</span>` : ''}`;
      right = myModel !== null ? 'model ' + lineTxt(myModel) + (edge !== null ? ` · edge ${edge.toFixed(1)}` : '') : 'model posts closer to kickoff';
    }
    return `<div class="srow"><div><span class="o">${home ? 'vs' : '@'} ${esc(opp)}</span><span class="r">${mid}</span></div><div><span class="sub">Wk ${esc(g.wk ?? '')} · ${esc(String(g.date || '').slice(5))}${g.div ? ' · div' : ''}</span><span class="sub">${right}</span></div></div>`;
  });
  const n = teams.length;
  return `<div class="sub" style="font-weight:600">#${me.rank} of ${n} · opponent-adjusted from play-by-play${P.ratings.through_week ? ', through week ' + P.ratings.through_week : ''}</div>
    <div class="tiles3">${statTile(sg1(me.rating), 'Rating · #' + me.rank)}${statTile(sg1(me.offense), 'Off · #' + rk('offense'))}${statTile(sg1(me.defense), 'Def · #' + rk('defense'))}</div>
    <div class="pbx"><div class="pr ph2" style="grid-template-columns:minmax(0,1fr) 62px 62px"><span>SPLITS</span><span>VALUE</span><span>RANK</span></div>
      ${[['off_pass', 'Pass offense'], ['off_rush', 'Rush offense'], ['def_pass', 'Pass defense'], ['def_rush', 'Rush defense'], ['special', 'Special teams']].map(([k, lbl]) => `<div class="pr" style="grid-template-columns:minmax(0,1fr) 62px 62px"><span>${lbl}</span><span>${sg1(me[k])}</span><span>#${rk(k)}</span></div>`).join('')}</div>
    <div class="tiles3">${statTile(`${w}-${l}${tie ? '-' + tie : ''}`, 'Record')}${statTile(`${aw}-${al}${ap ? '-' + ap : ''}`, 'ATS')}${statTile(`${mw}-${ml}${mp ? '-' + mp : ''}`, 'Model ATS')}</div>
    <div class="sub">Ratings are points vs an average team, higher is better on both sides of the ball. ATS is this team against the line; Model ATS is your model's side in their games.</div>
    <div><div class="lbl" style="margin-bottom:4px">Schedule · line and your model</div>${rows.join('') || '<div class="empty">No games in your file.</div>'}</div>`;

function teamSchedule(d, p, t){

    return {id: e.id, date: e.date, me, op, home: me.homeAway === 'home', state: st.state || 'pre', detail: st.shortDetail || st.detail || '', week: e.week && e.week.text};
  }).filter(e => e.op.team);
  if (!evs.length) return '<div class="empty">No schedule posted.</div>';
  const now = Date.now();
  let list = evs;
  if (evs.length > 30){
    const past = evs.filter(e => e.state === 'post'), rest = evs.filter(e => e.state !== 'post');
    list = past.slice(-10).concat(rest.slice(0, 10));
  }
  const W = e => { const a = parseFloat(scoreVal(e.me.score)), b = parseFloat(scoreVal(e.op.score)); return isNaN(a) || isNaN(b) ? '' : a > b ? 'W' : a < b ? 'L' : 'T'; };

    const ot = e.op.team || {};

    else if (e.state === 'in') right = `<span class="livec" style="white-space:nowrap">${liveDot}${esc(scoreVal(e.me.score))}–${esc(scoreVal(e.op.score))}</span>`;

  }).join('') + '</div>' + (d.sched && d.sched.partial ? '<div class="sub">Games from four weeks back to four weeks ahead.</div>' : evs.length > 30 ? '<div class="sub">Last 10 and next 10 games.</div>' : '');
}
function teamRoster(d, injOnly){

  return groups.filter(g => g.items.length).map(g => `${g.name ? `<div class="lbl ghdr">${esc(title(g.name))}</div>` : ''}<div>${g.items.slice().sort((a, b) => posRank(a) - posRank(b) || (+a.jersey || 0) - (+b.jersey || 0)).map(a => {
    const st = injOf(a);
    return `<div class="lrow" style="padding:8px 2px"><span style="display:flex;align-items:center;gap:10px;min-width:0"><span style="width:34px;font:800 18px var(--disp);color:var(--muted);flex:none">${a.jersey ? '#' + esc(a.jersey) : ''}</span><span class="main"><span style="font:700 16px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.displayName || a.fullName || '')}</span><span class="sub">${esc((a.position && a.position.abbreviation) || '')}</span></span></span>${st ? `<span class="tag ${INJ_RANK(st) === 0 ? 'down' : 'even'}">${esc(st)}</span>` : ''}</div>`;
  }).join('')}</div>`).join('');
}

      ${DEMO ? '' : `<div class="field" style="margin-top:14px"><label class="lbl" for="ghIn">Fantasy refresh key (GitHub)</label>
        <div class="sub">${S.ghToken ? 'Saved on this phone. The Refresh button on Fantasy uses it.' : 'Lets the Refresh button on Fantasy update your league right away.'}</div>
        <div class="row"><input id="ghIn" type="password" autocomplete="off" placeholder="${S.ghToken ? '•••••••• saved' : 'Paste key (github_pat_…)'}"><button class="chip on" style="height:48px" data-h="${h(() => { const v = $('#ghIn').value.trim(); if (!v) return; S.ghToken = v; save(); alert('Saved.'); render(); })}">Save</button></div>
        <div class="row" style="justify-content:flex-start;gap:18px"><button class="linkbtn" data-h="${h(ghKeySheet)}">How to make one ›</button>${S.ghToken ? `<button class="linkbtn" style="color:var(--red)" data-h="${h(() => { if (confirm('Remove the refresh key from this phone?')){ S.ghToken = ''; save(); render(); } })}">Remove key</button>` : ''}</div>
      </div>`}
      <div class="field" style="margin-top:14px"><label class="lbl" for="unitIn">Unit size ($)</label><div class="row"><input id="unitIn" inputmode="decimal" value="${esc(S.unit)}"><button class="chip on" style="height:48px" data-h="${h(() => { const v = parseFloat($('#unitIn').value); if (v > 0){ S.unit = v; save(); back(); } })}">Save</button></div></div>
      <div class="field" style="margin-top:18px"><span class="lbl">Backup</span><div class="sub">Copy this to move your teams and bets to another phone.</div>
        <button class="ghost" data-h="${h(() => { const t = JSON.stringify({favs: S.favs, bets: S.bets, unit: S.unit}); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('Copied.'), () => { $('#ioWrap').hidden = false; $('#ioBox').value = t; }); })}">Copy backup</button>
        <button class="linkbtn" data-h="${h(() => { $('#ioWrap').hidden = false; $('#ioBox').focus(); })}">Restore from a backup…</button>
        <div id="ioWrap" class="field" hidden><textarea id="ioBox" placeholder="Paste a backup here to restore"></textarea>
        <button class="ghost" data-h="${h(() => { try { const d = JSON.parse($('#ioBox').value); if (!Array.isArray(d.favs) || !Array.isArray(d.bets)) throw 0; if (confirm('Replace your teams and bets with this backup?')){ S.favs = d.favs; S.bets = d.bets; if (d.unit) S.unit = d.unit; save(); alert('Restored.'); back(); } } catch(e){ alert("That doesn't look like a SportsMF backup."); } })}">Restore backup</button></div>
      </div>

      ${DEMO ? '' : `<div class="toggle" style="margin-top:12px"><span>Call Sheet bets in SportsMF</span><button class="${S.showCS ? 'on' : ''}" data-h="${h(() => { S.showCS = !S.showCS; save(); render(); })}">${S.showCS ? 'ON' : 'OFF'}</button></div>`}
      <button class="ghost" style="margin-top:18px" data-h="${h(() => { if (confirm('Reset My Teams to the default list?')){ S.favs = JSON.parse(JSON.stringify(DEFAULT_FAVS)); save(); back(); } })}">Reset My Teams</button>
      <div class="sub" style="margin-top:14px">Scores, lines and news from ESPN's public feeds. NFL props from your Call Sheet odds pull.<br>Build ${esc(BUILD)}</div>`;
  }
};

/* ================= THEME ================= */
const darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  const dark = S.theme === 'dark' || (S.theme === 'auto' && darkQ && darkQ.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#0D0F12' : '#FFFFFF');
  /* home-screen app status bar: light text over the dark theme, dark text over the light one */
  const sb = document.querySelector('meta[name="apple-mobile-web-app-status-bar-style"]');
  if (sb) sb.setAttribute('content', dark ? 'black-translucent' : 'default');
}
if (darkQ && darkQ.addEventListener) darkQ.addEventListener('change', () => { if (S.theme === 'auto') applyTheme(); });
applyTheme();

/* ================= BOOT ================= */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => tab(b.dataset.tab)));
$('#logoBtn').addEventListener('click', () => tab('tonight'));
if (DEMO){ const pill = document.createElement('span'); pill.className = 'demo-pill'; pill.textContent = 'DEMO'; $('#logoBtn').appendChild(pill); document.title = 'SportsMF · Demo'; }
$('#gearBtn').addEventListener('click', () => go('settings'));
$('#navBack').addEventListener('click', () => { const V = VIEWS[cur().name]; if (V && V.back) V.back(cur().p); else back(); });
$('#view').addEventListener('scroll', updPast, {passive: true});
/* "Updated 12s ago" lines tick on their own. */
setInterval(() => document.querySelectorAll('#view .upd[data-ts]').forEach(el => {
  const extra = el.textContent.split(' · ').slice(1).join(' · ');
  el.textContent = updText(+el.dataset.ts) + (extra ? ' · ' + extra : '');
}), 1000);
/* Pull down to refresh on any screen that shows scores or bets. */
(function(){
  const v = $('#view'), ptr = $('#ptr'), lab = ptr.querySelector('span');
  const ok = () => ['tonight', 'game', 'league', 'bets', 'sports', 'news', 'fantasy'].includes(cur().name) && $('#sheet').hidden;
  let y0 = null, dy = 0, busy = false;
  v.addEventListener('touchstart', e => { if (!busy && v.scrollTop <= 0 && ok()){ y0 = e.touches[0].clientY; dy = 0; } else y0 = null; }, {passive: true});
  v.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || v.scrollTop > 0){ ptr.style.height = '0'; return; }
    ptr.style.height = Math.min(dy * 0.5, 56) + 'px';
    lab.textContent = dy > 110 ? 'Release to refresh' : 'Pull to refresh';
  }, {passive: true});
  v.addEventListener('touchend', async () => {
    if (y0 === null) return;
    y0 = null;
    if (dy > 110){
      busy = true; ptr.style.height = '36px'; lab.textContent = 'Refreshing…';
      mem.clear(); _cs = {t: 0, v: []};
      try { await render(true); } finally { busy = false; ptr.style.height = '0'; }
    } else ptr.style.height = '0';
  });
})();
function setDate(){ $('#todayLbl').textContent = new Date().toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}).replace(',', ' ·'); }
setDate();
/* Home-screen app: register the service worker (works on the live site only). */
if ('serviceWorker' in navigator && location.protocol === 'https:' && /github\.io$/.test(location.hostname)){
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
let tick = 0;
setInterval(() => {
  tick++;
  if (document.hidden || !$('#sheet').hidden) return;
  const c = cur(), n = c.name;
  /* Live pitch tracker: every 10 seconds. Everything else: every 30. */
  const pitchLive = n === 'game' && ((c.p.lg === 'mlb' && (!c.p.tab || c.p.tab === 'pitches') && c.p.ab === undefined && document.querySelector('#view .mlbsit'))
    || (/football/.test(c.p.path || '') && (!c.p.tab || c.p.tab === 'field') && c.p.drive === undefined && document.querySelector('#view .fsit'))
    || (/basketball/.test(c.p.path || '') && (!c.p.tab || c.p.tab === 'court') && document.querySelector('#view .bsit') && document.querySelector('#view .livec'))
    || (/hockey/.test(c.p.path || '') && (!c.p.tab || c.p.tab === 'rink') && document.querySelector('#view .hsit') && document.querySelector('#view .livec')));
  if (pitchLive){ render(true); return; }
  if (tick % 3) return;
  setDate();
  if (['tonight', 'game', 'league', 'bets'].includes(n)) render(true);
}, 10000);
/* Re-read Call Sheet data whenever it could have changed: coming back to
   this tab or app, Safari restoring the page, or the Call Sheet saving
   while both are open (the 'storage' event fires in this tab then). */
const FORM_VIEWS = ['addbet', 'addteam', 'settings', 'mflsetup'];
function refreshFromCS(){ _cs = {t: 0, v: []}; if (!FORM_VIEWS.includes(cur().name) && $('#sheet').hidden) render(true); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshFromCS(); });
window.addEventListener('pageshow', e => { if (e.persisted) refreshFromCS(); });
window.addEventListener('focus', refreshFromCS);
window.addEventListener('storage', e => { if (!e.key || e.key === CS_KEY) refreshFromCS(); });
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => render(true), 250); });
/* Home-screen apps on iOS can hang on to an old copy of this page. On each
   open, re-read this same file from the site and offer a reload if it has
   a newer build stamp. Silent if offline. */
async function checkBuild(){
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return;
    const m = (await r.text()).match(/const BUILD = '([^']+)'/);
    if (!m || m[1] === BUILD) return;
    const bar = document.createElement('button');
    bar.className = 'bigbtn blue';
    bar.style.cssText = 'position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:auto;z-index:30';
    bar.textContent = 'New version ready · tap to reload';
    bar.onclick = () => { location.href = location.pathname + '?' + (DEMO ? 'demo&' : '') + '_=' + Date.now(); };
    document.body.appendChild(bar);
  } catch (e){}
}
render();
checkBuild();
</script>
</body>
</html>
