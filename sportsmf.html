<style>
:root{
  --ink:#0B0B0C;--silver:#B0B7BC;--line:#D9DDE0;--soft:#F4F6F7;--muted:#4E565C;--dim:#6B7378;
  --blue:#0076B6;--blue2:#3A9BDC;--red:#D50A0A;--green:#14A44D;--green-t:#0E8A3E;--green-bg:#E8F6EE;--red-bg:#FDECEC;
  --bg:#FFFFFF;--card:#FFFFFF;--on-ink:#FFFFFF;
  --disp:'Saira Condensed',system-ui,sans-serif;
  --body:'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
}
:root[data-theme="dark"]{
  --ink:#F1F3F4;--silver:#59616A;--line:#2A2F35;--soft:#191C21;--muted:#A6AEB5;--dim:#8B949B;
  --blue:#3A9BDC;--blue2:#6CB8EA;--red:#FF5252;--green:#22C064;--green-t:#45D98A;--green-bg:#12301F;--red-bg:#3A1717;
  --bg:#0D0F12;--card:#15181D;--on-ink:#0D0F12;color-scheme:dark;
}
:root[data-theme="dark"] .sheet .bg{background:rgba(0,0,0,.6)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
main>*{flex-shrink:0}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-text-size-adjust:100%}
button{font-family:inherit;cursor:pointer;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--blue2);outline-offset:2px}
a{color:var(--blue)}
#app{height:100vh;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-top:env(safe-area-inset-top)}
.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 16px;flex:none}
.logo{display:flex;align-items:center;gap:9px;border:0;background:none;padding:0}
.slashes{display:flex;gap:3px;transform:skewX(-20deg)}
.slashes i{display:block;width:5px;height:26px}
.word{display:flex;transform:skewX(-10deg);position:relative;font:900 28px/1 var(--disp)}
.word .sp{padding:3px 4px 0 0}
.word .mf{background:#0076B6;color:#fff;padding:3px 7px 0;border-bottom:3px solid var(--red)}
.word .dot{position:absolute;top:-5px;right:-5px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid var(--bg)}
.date{font:700 17px var(--disp);letter-spacing:1.5px;color:var(--muted);text-transform:uppercase}

.numrow button{height:48px;border-radius:12px;border:1.5px solid var(--silver);background:var(--card);font:800 24px var(--disp)}
.sheet{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end}
.sheet[hidden]{display:none}
.sheet .bg{position:absolute;inset:0;background:rgba(11,11,12,.45);border:0;width:100%}
.sheet .body{position:relative;background:var(--card);border-radius:20px 20px 0 0;max-height:88vh;overflow-y:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:560px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--line);align-self:center}
.sheet img.hero{width:100%;border-radius:12px;max-height:200px;object-fit:cover}
.sheet h2{font:800 26px/1.15 var(--disp);margin:0}
.sheet p{font:400 18px/1.5 var(--body);margin:0}
.btnrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btnrow button{height:48px;border-radius:12px;border:1.5px solid var(--silver);background:var(--card);font:600 17px var(--body)}
.btnrow button.w{border-color:var(--green);color:var(--green-t)}
.btnrow button.l{border-color:var(--red);color:var(--red)}
.ghost{height:48px;border-radius:12px;border:1.5px solid var(--silver);background:var(--card);font:600 17px var(--body);width:100%}
.ghost.danger{color:var(--red);border-color:var(--red)}
.ls{display:grid;font:600 15px var(--body);border:1.5px solid var(--line);border-radius:12px;overflow:hidden}
.ls>div{display:grid;padding:8px 12px;border-top:1px solid var(--line);text-align:center}
.ls>div:first-child{border-top:0;background:var(--soft);font:700 12px var(--body);color:var(--muted)}
.ls>div>*:first-child{text-align:left}
.toggle{display:flex;justify-content:space-between;align-items:center;min-height:56px;gap:10px;border-bottom:1px solid var(--line);font:600 17px var(--body)}
.toggle button{width:64px;height:36px;border-radius:18px;border:1.5px solid var(--silver);background:var(--soft);font:700 13px var(--body)}
.toggle button.on{background:var(--blue);border-color:var(--blue);color:#fff}

<script>
'use strict';
/* ================= CONFIG ================= */
const BASE = 'https://site.api.espn.com/apis/site/v2/sports/';
const STAND = 'https://site.api.espn.com/apis/v2/sports/';
const LEAGUES = [
  {key:'nfl', name:'NFL', short:'NFL', path:'football/nfl', type:'team', per:'Q'},
  {key:'nba', name:'NBA', short:'NBA', path:'basketball/nba', type:'team', per:'Q'},
  {key:'nhl', name:'NHL', short:'NHL', path:'hockey/nhl', type:'team', per:'P', pts:true},
  {key:'mlb', name:'MLB', short:'MLB', path:'baseball/mlb', type:'team', per:'Inn '},
  {key:'cfb', name:'College FB', short:'CFB', path:'football/college-football', type:'team', college:true, rankings:true, q:'groups=80&limit=300', per:'Q', sport:'Football'},
  {key:'cbb', name:'College BB', short:'CBB', path:'basketball/mens-college-basketball', type:'team', college:true, rankings:true, q:'groups=50&limit=300', per:'H', sport:'Basketball'},
  {key:'chk', name:'College Hockey', short:'NCAAH', path:'hockey/mens-college-hockey', type:'team', college:true, rankings:true, nostand:true, q:'limit=300', per:'P', pts:true, sport:'Hockey'},
  {key:'golf', name:'Golf', short:'GOLF', path:'golf/pga', type:'golf', nodate:true},
  {key:'f1', name:'F1', short:'F1', path:'racing/f1', type:'race', nodate:true},
  {key:'soccer', name:'Soccer', short:'SOCCER', sub:'USMNT & national teams', path:'soccer/fifa.world', paths:['soccer/fifa.world','soccer/fifa.friendly','soccer/fifa.worldq.concacaf','soccer/concacaf.nations.league','soccer/concacaf.gold'], type:'team', per:"'", nostand:true},
  {key:'tennis', name:'Tennis', short:'TENNIS', path:'tennis/atp', paths:['tennis/atp','tennis/wta'], type:'tennis', nodate:true}
];
const LG = Object.fromEntries(LEAGUES.map(l => [l.key, l]));
/* College football filters. ESPN group ids; "Slums" = every other FBS
   conference (MAC, Mountain West, Sun Belt, independents). */
const CFB_CONF = [
  {k:'fbs', l:'FBS', g:[80], m:null},
  {k:'fcs', l:'FCS', g:[81], m:null},
  {k:'sec', l:'SEC', g:[8], m:/southeastern|^sec\b/i},
  {k:'b10', l:'Big Ten', g:[5], m:/big ten/i},
  {k:'acc', l:'ACC', g:[1], m:/atlantic coast|^acc\b/i},
  {k:'b12', l:'Big 12', g:[4], m:/big 12/i},
  {k:'p12', l:'Pac-12', g:[9], m:/pac-?12/i},
  {k:'cusa', l:'C-USA', g:[12], m:/conference usa|c-usa/i},
  {k:'aac', l:'American', g:[151], m:/american/i},
  {k:'slums', l:'Slums', g:[15, 17, 37, 18], m:/mid-american|mountain west|sun belt|independent/i}
];
const CFB = Object.fromEntries(CFB_CONF.map(c => [c.k, c]));
const TEAM_LGS = LEAGUES.filter(l => l.type === 'team');
const COLLEGE_LGS = LEAGUES.filter(l => l.college);
const BOOKS = ['DraftKings','FanDuel','Bet365','BetMGM','Fanatics','Hard Rock','theScore','BetRivers','betPARX','Caesars','ESPN BET'];
const BOOK_MAP = {draftkings:'DraftKings', fanduel:'FanDuel', betmgm:'BetMGM', caesars:'Caesars', espnbet:'ESPN BET', bet365:'Bet365', fanatics:'Fanatics', hardrock:'Hard Rock', hardrockbet:'Hard Rock', betrivers:'BetRivers', thescore:'theScore', betparx:'betPARX'};
const BUILD = '2026-10-17 v23';
/* The Call Sheet lives on the same site (jibboo72.github.io), so its saved
   data and its published odds file are both readable from here. */
const CS_KEY = 'nfl-call-sheet-v3';
const CS_URL = '/callsheet-data/';
const CS_ODDS = ['/callsheet-data/data/odds-2026.json', 'https://raw.githubusercontent.com/Jibboo72/callsheet-data/main/data/odds-2026.json'];
const ABBR_ALIAS = {LAR:'LA', WSH:'WAS', JAC:'JAX', LV:'LV', LVR:'LV'};
const MARKETS = {
  receiving_receptions:'Receptions', receiving_longestReception:'Longest Rec', receiving_yards:'Rec Yards', receiving_targets:'Targets',
  'rushing+receiving_yards':'Rush + Rec Yds', touchdowns:'Anytime TD', firstTouchdown:'1st TD', lastTouchdown:'Last TD',
  passing_touchdowns:'Pass TDs', rushing_touchdowns:'Rush TDs', passing_yards:'Pass Yards', rushing_yards:'Rush Yards'
};
const YESNO = /touchdown/i;
/* Call Sheet cards and how its markets map to the odds-file markets. */
const CS_CARDS = {slot:'Slot Floor', long:'Volume Longest', fade:'Matchup Fade', qb:'Longest Completion', td:'Anytime TD', tetd:'TE Anytime TD', ctd:'College TD', flyer:'Injury Flyer', gparlay:'Group Parlay'};
const CS_MKT = {rec:'receiving_receptions', yds:'receiving_yards', lng:'receiving_longestReception', tgt:'receiving_targets', td:'touchdowns', ftd:'firstTouchdown', ptd:'passing_touchdowns'};
const nameKey = s => String(s || '').toLowerCase().replace(/\b(jr|sr|ii|iii|iv)\b\.?/g, '').replace(/[^a-z]/g, '');
const DEFAULT_FAVS = [
  {name:'Detroit Lions', lg:['nfl']},
  {name:'Detroit Tigers', lg:['mlb']},
  {name:'Detroit Red Wings', lg:['nhl']},
  {name:'Detroit Pistons', lg:['nba']},
  {name:'Los Angeles Kings', label:'LA Kings', lg:['nhl']},
  {name:'USC Trojans', lg:['cfb','cbb'], college:true},
  {name:'Michigan State Spartans', lg:['cfb','cbb','chk'], college:true}
];

/* ================= STORAGE ================= */
const store = {
  get(k, d){ try { const v = localStorage.getItem('smf.' + k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem('smf.' + k, JSON.stringify(v)); } catch(e){} }
};
const S = {
  favs: store.get('favs', DEFAULT_FAVS),
  bets: store.get('bets', []),
  unit: store.get('unit', 14),
  lastBook: store.get('lastBook', 'DraftKings'),
  showCS: store.get('showCS', true),
  theme: store.get('theme', 'light'),
  mfl: store.get('mfl', {host: 'www45.myfantasyleague.com', year: '2026', league: '30258', franchise: '', apikey: ''}),
  ghToken: store.get('ghToken', ''),
  fantasyPos: store.get('fantasyPos', 'bottom'),
  bubbles: store.get('bubbles', ['nfl', 'nba', 'nhl', 'mlb', 'college', 'other'])
};
function save(){ store.set('favs', S.favs); store.set('bets', S.bets); store.set('unit', S.unit); store.set('lastBook', S.lastBook); store.set('showCS', S.showCS); store.set('theme', S.theme); store.set('mfl', S.mfl); store.set('ghToken', S.ghToken); store.set('fantasyPos', S.fantasyPos); store.set('bubbles', S.bubbles); }

/* Call Sheet bets, read-only. Paper bets are skipped, same as the Call
   Sheet's own bankroll. Stakes there are dollars, so they're converted to
   units here with your SportsMF unit size. */
function csBets(){
  if (!S.showCS) return [];
  try {
    const raw = localStorage.getItem(CS_KEY);
    if (!raw) return [];
    const s = JSON.parse(raw);
    const list = (s && s.bank && s.bank.bets) || [];
    return list.filter(b => b && !b.paper).map(b => {
      const stake = +b.stake || 0, odds = parseInt(b.odds, 10);
      const status = b.result === 'W' ? 'won' : b.result === 'L' ? 'lost' : b.result === 'P' ? 'push' : 'open';
      let pl = 0;
      if (status === 'won'){
        const ret = b.fixedReturn !== null && b.fixedReturn !== undefined ? +b.fixedReturn : (odds ? stake * (odds > 0 ? 1 + odds / 100 : 1 + 100 / Math.abs(odds)) : stake);
        pl = ret - stake;
      } else if (status === 'lost') pl = -stake;
      const u = S.unit || 1;
      return {
        id: 'cs-' + b.id, cs: true, lg: (b.league === 'cfb' || b.kind === 'cfb') ? 'cfb' : 'nfl', market: b.market || '',
        type: b.kind === 'parlay' ? 'parlay' : b.kind === 'prop' ? 'prop' : 'side', pick: b.desc || 'Call Sheet bet',
        odds: isNaN(odds) ? null : odds, book: b.book || 'Call Sheet', units: Math.round(stake / u * 100) / 100, stake,
        status, plUnits: pl / u, date: b.ts ? new Date(b.ts).toISOString() : null, settled: status !== 'open' ? (b.ts || 0) : null, wk: b.wk,
        matches: [b.match].concat((b.legs || []).map(l => l && l.match)).filter(m => m && m.includes('@')),
        gdate: b.gdate || '', ts: b.ts || 0
      };
    });
  } catch (e){ return []; }
}
/* Call Sheet weeks, calculated exactly the way the Call Sheet does it:
   week 1 starts 2026-09-08 and runs to the following Monday, then
   Tuesday–Monday blocks, using the same UTC date it uses for "today". */
const CS_WEEK1 = '2026-09-08';
function csAddDays(s, n){ const d = new Date(s + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() + n); return d.toISOString().slice(0, 10); }
function csWeekNow(){
  const t = new Date().toISOString().slice(0, 10);
  if (t < CS_WEEK1) return 0;
  const d = new Date(CS_WEEK1 + 'T00:00:00Z');
  const w1End = csAddDays(CS_WEEK1, (1 - d.getUTCDay() + 7) % 7);
  if (t <= w1End) return 1;
  for (let n = 2; n <= 30; n++) if (t <= csAddDays(w1End, 7 * (n - 1))) return n;
  return null;
}
/* Same math as the Call Sheet's bankStats(): paper skipped, pushes return
   the stake, fixed returns and boosts honored. Dollars. */
function csWeekStats(wk){
  if (!S.showCS) return null;
  try {
    const raw = localStorage.getItem(CS_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    const bets = (s && s.bank && s.bank.bets) || [];
    let staked = 0, ret = 0, open = 0, w = 0, l = 0, p = 0;
    const dec = am => { am = Number(am); if (!am || isNaN(am)) return null; return am > 0 ? 1 + am / 100 : 1 + 100 / Math.abs(am); };
    const pay = (st, x) => {
      if (x.fixedReturn !== null && x.fixedReturn !== undefined) return Number(x.fixedReturn);
      const dd = dec(x.odds); const base = dd ? st * dd : st;
      return x.boost ? st + (base - st) * (1 + Number(x.boost) / 100) : base;
    };
    bets.forEach(x => {
      if (!x || x.paper || Number(x.wk) !== Number(wk)) return;
      const st = Number(x.stake) || 0;
      if (x.result === 'W'){ staked += st; ret += pay(st, x); w++; }
      else if (x.result === 'L'){ staked += st; l++; }
      else if (x.result === 'P'){ staked += st; ret += st; p++; }
      else open += st;
    });
    return {pl: ret - staked, staked, open, w, l, p};
  } catch (e){ return null; }
}
/* Picks sitting on your Call Sheet cards for the sheet week you're on and
   the current calendar week (usually the same). Read-only. */
function csPicks(){
  try {
    const raw = localStorage.getItem(CS_KEY);
    if (!raw) return [];
    const s = JSON.parse(raw);
    const weeks = [...new Set([s.week, csWeekNow()].filter(w => w !== null && w !== undefined).map(String))];
    const out = [];
    weeks.forEach(wk => {
      const cards = (s.cards && s.cards[wk]) || {};
      Object.entries(cards).forEach(([cid, cd]) => (cd && cd.picks || []).forEach(pk => {
        if (!pk || !pk.who || pk.cfb) return;
        out.push({card: CS_CARDS[cid] || cid, cid, who: pk.who, key: nameKey(pk.who), mkt: CS_MKT[pk.mkt] || pk.mkt, side: pk.side, line: pk.line, odds: pk.odds, book: pk.book, grade: pk.grade || null, placed: !!pk.betId, what: pk.what || ''});
      }));
    });
    return out;
  } catch (e){ return []; }
}
const signedMoney = v => (v > 0 ? '+' : v < 0 ? '−' : '') + '$' + Math.abs(v).toFixed(2);
let _cs = {t: 0, v: []};
function csCached(){ if (Date.now() - _cs.t > 4000) _cs = {t: Date.now(), v: csBets()}; return _cs.v; }
/* Call Sheet game bets carry "AWAY @ HOME" plus the game date. Match that
   to an ESPN game by team (abbreviation or name) and date, within a day
   either way to cover late-night UTC kickoffs. */
function teamHit(token, t){
  token = String(token || '').trim();
  if (!token) return false;
  const ab = s => (ABBR_ALIAS[String(s || '').toUpperCase()] || String(s || '').toUpperCase());
  return ab(token) === ab(t.abbr) || same(token, t.short) || same(token, t.name);
}
function csMatches(b, ev){
  if (!b.matches.length) return false;
  const evDay = fromYmd(ymd(new Date(ev.date))).getTime();
  let dayOk;
  if (b.gdate && /^\d{4}-\d{2}-\d{2}$/.test(b.gdate)){
    const gd = new Date(+b.gdate.slice(0,4), +b.gdate.slice(5,7) - 1, +b.gdate.slice(8,10)).getTime();
    dayOk = Math.abs(gd - evDay) <= 864e5;
  } else {
    dayOk = b.ts && b.ts <= new Date(ev.date).getTime() + 6 * 3600e3 && new Date(ev.date).getTime() - b.ts < 7 * 864e5;
  }
  if (!dayOk) return false;
  return b.matches.some(m => { const [a, hm] = m.split('@'); return teamHit(a, ev.away) && teamHit(hm, ev.home); });
}

/* ================= UTIL ================= */
const $ = s => document.querySelector(s);
function esc(s){ return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function ymd(d){ return d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0'); }
function fromYmd(s){ return new Date(+s.slice(0,4), +s.slice(4,6)-1, +s.slice(6,8)); }
function addDays(s, n){ const d = fromYmd(s); d.setDate(d.getDate()+n); return ymd(d); }
const today = () => ymd(new Date());
function dayLabel(s){
  const t = today();
  if (s === t) return 'Today';
  if (s === addDays(t,1)) return 'Tomorrow';
  if (s === addDays(t,-1)) return 'Yesterday';
  return fromYmd(s).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});
}
function tm(iso){ const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'}); }
function shortDate(iso){ const d = new Date(iso); return ymd(d) === today() ? tm(iso) : d.toLocaleDateString(undefined, {month:'short', day:'numeric'}); }
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (!isFinite(m)) return '';
  if (m < 60) return Math.max(1, m) + 'm ago';
  const h = Math.round(m/60); if (h < 24) return h + 'h ago';
  return Math.round(h/24) + 'd ago';
}
const same = (a, b) => String(a||'').trim().toLowerCase() === String(b||'').trim().toLowerCase();
function fmtOdds(o){ if (o === null || o === undefined || o === '') return '—'; const n = +o; if (isNaN(n)) return esc(o); return n > 0 ? '+' + n : '' + n; }
function fmtLine(n){ if (n === null || n === undefined || n === '' || isNaN(+n)) return '—'; n = +n; return n > 0 ? '+' + n : '' + n; }
function fmtU(x){ const v = Math.round(x * 100) / 100; if (v === 0) return '0u'; return (v > 0 ? '+' : '−') + String(Math.abs(v)) + 'u'; }
function winUnits(b){ const o = +b.odds; if (!o) return 0; return o > 0 ? b.units * o / 100 : b.units * 100 / Math.abs(o); }
function profit(b){ if (b.cs) return b.status === 'open' ? 0 : b.plUnits; if (b.status === 'won') return winUnits(b); if (b.status === 'lost') return -b.units; return 0; }
const money = x => '$' + (Math.round(x * 100) / 100).toFixed(x % 1 ? 2 : 0);
function logo(src, cls){ return src ? `<img class="logoimg" src="${esc(src)}" alt="" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'ph'}))">` : '<span class="ph"></span>'; }
/* List pages start from an estimate, then render() measures the real
   screen and nudges the count up or down (FIT) so each page is full
   without scrolling. Remembered per screen and phone height. */
const FIT = {};
let FITKEY = '';
/* Scrolling lists: everything on one page. */
function perPage(){ return 1e9; }

/* ================= DATA ================= */
const mem = new Map();
let LAST_FETCH = Date.now();
async function getJSON(url, ttl){
  ttl = ttl ?? 25000;
  const c = mem.get(url);
  if (c && Date.now() - c.t < ttl) return c.v;
  const r = await fetch(url);
  if (!r.ok) throw new Error('Feed error ' + r.status);
  const v = await r.json();

/* ================= LIVE BET READING =================
   Your SportsMF bets carry type/side/line. Call Sheet game bets are typed
   free-hand ("DET -3.5", "Lions ML", "o47.5"), so they're read against the
   two teams in the game. Anything that can't be read (props, parlays,

const reEsc = x => String(x).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
function teamMentions(str, t){
  const low = str.toLowerCase();
  const loc = String(t.name || '').split(' ').slice(0, -1).join(' ');
  const cands = [t.abbr, ABBR_ALIAS[String(t.abbr || '').toUpperCase()], Object.keys(ABBR_ALIAS).find(k => ABBR_ALIAS[k] === String(t.abbr || '').toUpperCase()), t.short, t.name, loc]
    .filter(c => c && String(c).length >= 2);
  let at = -1;
  cands.forEach(c => {
    const m = new RegExp('(^|[^a-z])' + reEsc(String(c).toLowerCase()) + '(?=[^a-z]|$)').exec(low);
    if (m && (at < 0 || m.index < at)) at = m.index + m[1].length;
  });
  return at;
}
function parsePick(desc, market, ev){
  const str = String(desc || '').replace(/−/g, '-').trim();
  if (!str || market === 'td' || market === 'other') return null;
  let m = str.match(/(?:^|[^a-z])(o|over|u|under)\s*(\d+(?:\.\d+)?)/i);
  if (m && market !== 'ml') return {type: 'total', side: /^o/i.test(m[1]) ? 'over' : 'under', line: +m[2]};
  if (market === 'total') return null;
  const hi = teamMentions(str, ev.home), ai = teamMentions(str, ev.away);
  if (hi < 0 && ai < 0) return null;
  const num = str.match(/(^|\s)([+-]\s?\d+(?:\.\d+)?)(?!\d)|\b(pk|pick'?em|even)\b/i);
  let side;
  if (hi >= 0 && ai >= 0){
    const ni = num ? num.index : Infinity;
    const before = [['home', hi], ['away', ai]].filter(x => x[1] < ni).sort((a, b) => b[1] - a[1]);
    side = before.length ? before[0][0] : (hi < ai ? 'home' : 'away');
  } else side = hi >= 0 ? 'home' : 'away';
  if (market === 'ml' || /\bml\b|money ?line|to win/i.test(str)) return {type: 'ml', side};
  if (num) return {type: 'spread', side, line: num[3] ? 0 : +num[2].replace(/\s/g, '')};
  return null;
}
function betRead(b, ev){

}
const n1 = x => String(Math.round(Math.abs(x) * 10) / 10);
/* {cls: up|down|even, text} for a bet on a game that has started. */
function liveRead(b, ev){
  if (ev.state === 'pre') return null;
  const r = betRead(b, ev);
  if (!r) return null;
  const hs = parseFloat(ev.home.score), as = parseFloat(ev.away.score);
  if (isNaN(hs) || isNaN(as)) return null;
  const fin = ev.state === 'post';
  if (fin){
    const res = evalBet(r, ev);
    if (!res) return null;
    return {cls: res === 'won' ? 'up' : res === 'lost' ? 'down' : 'even', text: (res === 'won' ? 'Won' : res === 'lost' ? 'Lost' : 'Push') + (b.cs ? ' · grade in Call Sheet' : '')};
  }
  if (r.type === 'total'){
    const d = hs + as - (+r.line);
    if (d === 0) return {cls: 'even', text: 'On the number'};
    if (r.side === 'over') return d > 0 ? {cls: 'up', text: 'Over by ' + n1(d)} : {cls: 'down', text: 'Needs ' + Math.ceil(-d) + ' more'};
    return d < 0 ? {cls: 'up', text: 'Under by ' + n1(d)} : {cls: 'down', text: 'Over by ' + n1(d)};

function boxStat(s, nameTest, cat, label){

    if (c.name !== cat) return;
    const i = (c.labels || []).map(l => String(l).toUpperCase()).indexOf(label);
    if (i < 0) return;

function propRead(b, ev, s){

    [/long(est)?\s*rec/, 'receiving', 'LONG', 'long'], [/rec(eiving)?\s*y(ar)?ds/, 'receiving', 'YDS', 'rec yds'], [/\brec(eptions?)?\b|catches/, 'receiving', 'REC', 'rec']];
  const k = kinds.find(x => x[0].test(t));

  if ((m = t.match(/(?:^|[^a-z])(o|over|u|under)\s*(\d+(?:\.\d+)?)/))){ side = /^o/.test(m[1]) ? 'over' : 'under'; line = +m[2]; }
  else if ((m = t.match(/(\d+(?:\.\d+)?)\s*\+/))) line = +m[1] - 0.5;
  if (line === null) return null;
  const v = boxStat(s, test, k[1], k[2]);
  const val = v === null ? 0 : v;

    if (val > line) return {cls: 'up', text: lbl + ' · hit'};

  }

/* ================= BET GRADING ================= */
function evalBet(b, ev){
  const hs = parseFloat(ev.home.score), as = parseFloat(ev.away.score);
  if (isNaN(hs) || isNaN(as)) return null;
  if (b.type === 'total'){ const d = hs + as - (+b.line); if (d === 0) return 'push'; return (d > 0) === (b.side === 'over') ? 'won' : 'lost'; }
  const mine = b.side === 'home' ? hs : as, opp = b.side === 'home' ? as : hs;
  if (b.type === 'spread'){ const m = mine - opp + (+b.line); return m > 0 ? 'won' : m < 0 ? 'lost' : 'push'; }
  if (b.type === 'ml') return mine > opp ? 'won' : mine < opp ? 'lost' : 'push';
  return null;
}
function gradeEvents(evs){

    for (const b of S.bets){

      const r = evalBet(b, ev);
      if (r){ b.status = r; b.settled = Date.now(); ch = true; }
    }

  if (ch) save();
  return ch;
}

function autoFit(V, s, data, avail, depth){
  const v = $('#view');
  const rows = [...v.querySelectorAll('.card, .gr, .lrow, .lb, .news')].filter(x => x.offsetHeight > 0);
  if (!rows.length || depth > 3) return;
  const pg = v.querySelector('.pager');
  const r0 = rows[0], r1 = rows[1];
  const rowH = (r1 && r1.parentNode === r0.parentNode && r1.offsetTop > r0.offsetTop) ? r1.offsetTop - r0.offsetTop : r0.offsetHeight + 12;
  if (rowH <= 0) return;
  const over = v.scrollHeight - v.clientHeight;
  let extra = 0;
  if (over > 2) extra = -Math.ceil(over / rowH);
  else if (pg){
    const next = pg.querySelectorAll('button')[1];
    if (next && next.disabled) return;          // last page: short on purpose
    const last = rows[rows.length - 1];
    const free = pg.offsetTop - (last.offsetTop + last.offsetHeight) - 4;
    extra = Math.floor(free / rowH);

  if (!extra) return;

function rowExtras(ev, ctx){
  const out = {wind: null, edge: null};

  if (ev.state !== 'post' && ctx.wx){
    let w = null;
    if (ev.lg === 'cfb') w = ctx.wx.cfb && ctx.wx.cfb[String(ev.id)];

async function csOdds(){

const normAbbr = a => ABBR_ALIAS[String(a || '').toUpperCase()] || String(a || '').toUpperCase();
function csGameFor(odds, ev){
  const games = (odds && odds.games) || [];
  const h = normAbbr(ev.home.abbr), a = normAbbr(ev.away.abbr);
  const t = new Date(ev.date).getTime();
  return games.find(g => normAbbr(g.home) === h && normAbbr(g.away) === a && Math.abs(new Date(g.start).getTime() - t) < 2 * 864e5) || null;

}
const toDec = o => { o = parseInt(o, 10); return !o ? 0 : o > 0 ? 1 + o / 100 : 1 + 100 / Math.abs(o); };

  let best = null;
  Object.entries(p.books || {}).forEach(([k, v]) => {
    if (!v || v.odds === null || v.odds === undefined) return;
    if (v.line !== null && v.line !== undefined && +v.line !== +p.line) return;
    if (!best || toDec(v.odds) > toDec(best.odds)) best = {odds: v.odds, book: BOOK_MAP[k] || k};

}
function propRows(game, mkt){
  const rows = new Map();
  (game.props || []).filter(p => p.market === mkt && p.player).forEach(p => {
    if (YESNO.test(mkt) && p.side !== 'over') return;
    const key = p.player + '|' + p.line;
    const r = rows.get(key) || {player: p.player, name: playerName(p.player), line: p.line};
    r[p.side] = bestPrice(p);
    rows.set(key, r);
  });
  const list = [...rows.values()];
  if (YESNO.test(mkt)) return list.sort((a, b) => toDec(a.over && a.over.odds) - toDec(b.over && b.over.odds));

  const summary = picks.length

/* ---------- MyFantasyLeague ----------
   MFL's API terms forbid calling it with JavaScript from pages outside
   myfantasyleague.com. So a GitHub Action in this repo (mfl_pull.py)
   pulls the league server-side into data/mfl.json, and SportsMF only
   reads that file from its own site. */
const arr = x => Array.isArray(x) ? x : (x ? [x] : []);
const mflOn = () => !!(S.mfl && S.mfl.franchise);
async function mflSnapshot(fresh){
  const url = new URL('data/mfl.json', location.href).href + '?t=' + (fresh ? Date.now() : Math.floor(Date.now() / 60000));
  const d = await getJSON(url, fresh ? 0 : 60000);
  const fr = {};
  arr(d.league && d.league.franchises).forEach(f => { fr[f.id] = f; });
  return {name: d.league && d.league.name, fr, franchises: arr(d.league && d.league.franchises), week: d.week, matchups: arr(d.matchups).map(arr), players: d.players || {}, stand: arr(d.standings), generated: d.generated};
}
function mflName(pl){ if (!pl) return 'Player'; const n = String(pl.name || ''); const i = n.indexOf(','); return i > 0 ? n.slice(i + 1).trim() + ' ' + n.slice(0, i).trim() : n; }
const fmtPts = v => { const n = parseFloat(v); return isNaN(n) ? '0.0' : n.toFixed(1); };
function myMatchup(snap){
  const me = S.mfl.franchise;
  const m = snap.matchups.find(pair => pair.some(f => f.id === me));
  if (!m) return null;
  return {me: m.find(f => f.id === me), opp: m.find(f => f.id !== me)};
}
function fantasyCard(snap){
  const mm = myMatchup(snap);
  if (!mm || !mm.opp) return '';
  const nm = id => (snap.fr[id] && snap.fr[id].name) || 'Team ' + id;
  const a = parseFloat(mm.me.score) || 0, b = parseFloat(mm.opp.score) || 0;
  const left = (+mm.me.playersYetToPlay || 0) + (+mm.me.playersCurrentlyPlaying || 0);
  const row = (f, mine) => `<div class="tm"><span class="nm" style="${mine ? 'color:var(--blue)' : ''}">${esc(nm(f.id))}</span><span class="sc ${!mine && b < a ? 'lose' : mine && a < b ? 'lose' : ''}">${fmtPts(f.score)}</span></div>`;
  return `<button class="card" data-h="${h(() => go('fantasy', {tab: 'mine'}))}"><div class="meta"><span>FANTASY · WK ${esc(snap.week || '')}</span><span class="r">${left ? (mm.me.playersCurrentlyPlaying > 0 ? '<span class="livec">' + liveDot + esc(mm.me.playersCurrentlyPlaying) + ' playing</span>' : esc(left) + ' to play') : 'Done'}</span></div>${row(mm.me, true)}${row(mm.opp, false)}<div class="foot"><span class="ln">${a >= b ? 'Up' : 'Down'} ${Math.abs(a - b).toFixed(1)} · ${esc(snap.name || 'MFL')}</span><span class="tag ${a >= b ? 'bet' : 'my'}">MY TEAM</span></div></button>`;
}
/* Refresh now: starts the "MFL pull" job on GitHub right away instead of
   waiting for its schedule. Uses a GitHub key saved only on this phone,
   made to do one thing: run Actions in the sportsmf repo. It never goes
   anywhere but api.github.com and is left out of backups. */
const GH = {repo: 'Jibboo72/sportsmf', wf: 'mfl.yml', ref: 'main'};
let mflRef = {state: '', msg: ''};
const wait = ms => new Promise(r => setTimeout(r, ms));
function ghApi(path, opt){
  return fetch('https://api.github.com/repos/' + GH.repo + path, Object.assign({cache: 'no-store', headers: {Authorization: 'Bearer ' + S.ghToken, Accept: 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'}}, opt || {}));
}
function setRef(state, msg){
  mflRef = {state, msg};
  if (cur().name === 'fantasy') render(true);
}
async function refreshMFL(){
  if (!S.ghToken){ go('settings'); return; }
  if (mflRef.state === 'busy') return;
  let before = null;
  try { before = (await mflSnapshot(true)).generated; } catch (e){}
  const t0 = Date.now();
  setRef('busy', 'Starting the update on GitHub…');
  let r;
  try { r = await ghApi(`/actions/workflows/${GH.wf}/dispatches`, {method: 'POST', body: JSON.stringify({ref: GH.ref})}); }
  catch (e){ return setRef('err', "Couldn't reach GitHub. Check your connection."); }
  if (r.status === 401) return setRef('err', 'GitHub didn\'t accept your key. It may have expired. Make a new one in Settings.');
  if (r.status === 403 || r.status === 404) return setRef('err', 'Your key can\'t run this job. It needs the sportsmf repo with Actions: Read and write.');
  if (r.status !== 204) return setRef('err', 'GitHub answered ' + r.status + '. Try again in a minute.');
  setRef('busy', 'Running on GitHub… usually about a minute');
  for (let i = 0; i < 24; i++){
    await wait(10000);
    try {
      const rr = await ghApi(`/actions/workflows/${GH.wf}/runs?event=workflow_dispatch&per_page=1`);
      if (rr.ok){
        const run = ((await rr.json()).workflow_runs || [])[0];
        if (run && new Date(run.created_at).getTime() >= t0 - 60000 && run.status === 'completed'){
          if (run.conclusion !== 'success') return setRef('err', 'The update failed on GitHub. Open Actions › MFL pull to see why.');
          if (mflRef.msg.indexOf('Saved') !== 0) setRef('busy', 'Saved. Waiting for your site to publish it…');
        }
      }
    } catch (e){}
    try {
      const snap = await mflSnapshot(true);
      if (snap.generated && snap.generated !== before){ mem.forEach((v, k) => { if (k.includes('data/mfl.json')) mem.delete(k); }); return setRef('ok', 'Updated just now'); }
    } catch (e){}
  }
  setRef('err', 'Still waiting on GitHub. Pull down in a minute to check.');
}

const LG_LOGO = k => ({nfl: 'nfl', nba: 'nba', nhl: 'nhl', mlb: 'mlb'})[k] ? `https://a.espncdn.com/i/teamlogos/leagues/500/${k}.png` : '';

  nfl: {label: 'NFL', lgs: ['nfl']}, nba: {label: 'NBA', lgs: ['nba']}, nhl: {label: 'NHL', lgs: ['nhl']}, mlb: {label: 'MLB', lgs: ['mlb']},

  other: {label: 'Other', lgs: null}
};
const BUBBLE_ORDER = ['nfl', 'nba', 'nhl', 'mlb', 'college', 'cfb', 'cbb', 'chk', 'golf', 'f1', 'soccer', 'tennis', 'other'];
/* "Other" = every league that no other turned-on bubble already covers. */
function bubbleLgs(id){
  const b = BUBBLES[id];
  if (!b) return [];
  if (b.lgs) return b.lgs;
  const covered = new Set(S.bubbles.filter(x => x !== 'other' && BUBBLES[x]).flatMap(x => BUBBLES[x].lgs));
  return LEAGUES.map(l => l.key).filter(k => !covered.has(k));
}
function bubbleHtml(id, on, onTap){
  const b = BUBBLES[id], lg = b.lgs && b.lgs.length === 1 ? b.lgs[0] : null, src = lg ? LG_LOGO(lg) : '';

  return `<button class="bub ${on ? 'on' : ''}" aria-label="${esc(b.label)} scores" data-h="${h(onTap)}">${inner}</button>`;
}

/* ---------- TONIGHT ---------- */
VIEWS.tonight = {
  async load(p){
    if (p && p.bub && BUBBLES[p.bub]){
      const lgs = bubbleLgs(p.bub);
      if (!lgs.length) return {bub: true, lgs, lp: null};
      const lg = lgs.includes(p.blg) ? p.blg : lgs[0];
      const lp = Object.assign(p, {lg, date: p.date || today(), mode: p.mode || 'scores', embed: true});
      return {bub: true, lgs, lp, league: await VIEWS.league.load(lp)};
    }
    const t = today();
    const keys = new Set();
    S.favs.forEach(f => f.lg.forEach(k => { if (LG[k]) keys.add(k); }));
    S.bets.forEach(b => { if (b.eventId && LG[b.lg] && ymd(new Date(b.date)) === t) keys.add(b.lg); });
    const tDay = fromYmd(t).getTime();
    csCached().forEach(b => {
      if (!b.matches.length) return;
      const near = b.gdate ? Math.abs(new Date(b.gdate + 'T12:00:00').getTime() - tDay - 12 * 3600e3) <= 1.5 * 864e5 : (Date.now() - b.ts < 7 * 864e5);
      if (near) keys.add(b.lg);
    });
    const rs = await Promise.allSettled([...keys].map(k => board(LG[k], t).then(es => es.map(e => norm(e, k)))));
    const evs = []; let fails = 0;
    rs.forEach(r => r.status === 'fulfilled' ? evs.push(...r.value) : fails++);
    if (keys.size && fails === keys.size) throw new Error('The scores feed is unreachable');
    gradeEvents(evs);
    learnLogos(evs);
    const seen = new Set();
    const mine = evs.filter(e => (isFav(e) || betsFor(e).length) && !seen.has(e.id) && seen.add(e.id)).sort(sortEvents);
    let fantasy = null;
    if (mflOn() && S.mfl.franchise){
      try { const snap = await mflSnapshot(); if (myMatchup(snap)) fantasy = snap; } catch (e){}
    }
    await attachBoxes(mine);
    const ctx = {};
    await Promise.all(['nfl', 'cfb'].filter(k => mine.some(e => e.lg === k)).map(async k => { ctx[k] = await scoreCtx(k); }));
    return {evs: mine, fails, fantasy, ctx};

      ${bubs.length ? `<div class="bubs">${bubs.map(id => bubbleHtml(id, p.bub === id, () => p.bub === id ? tab('tonight') : tab('tonight', {bub: id}))).join('')}</div>` : ''}`;
    if (d.bub){
      if (!d.lp) return header + '<div class="empty">Every league is already on its own bubble.</div>';
      const sub = d.lgs.length > 1 ? `<div class="chips sm" style="margin-top:10px">${d.lgs.map(k => `<button class="chip ${d.lp.lg === k ? 'on' : ''}" data-h="${h(() => tab('tonight', {bub: p.bub, blg: k}))}">${esc(LG[k].name)}</button>`).join('')}</div>` : '';
      return header + sub + `<div style="margin-top:${sub ? 6 : 10}px">` + VIEWS.league.build(d.lp, d.league, avail) + '</div>';
    }

const HIT_EV = ['single', 'double', 'triple', 'home_run'];

  const t = x.team || {};
  const id = String(t.id || '');
  if (id && id === String(ev.home.id)) return ev.home;
  if (id && id === String(ev.away.id)) return ev.away;
  if (t.abbreviation) return same(t.abbreviation, ev.home.abbr) ? ev.home : same(t.abbreviation, ev.away.abbr) ? ev.away : {abbr: t.abbreviation, logo: t.logo};
  return null;
}
/* Every scoring play we can find for the sport: football has a ready
   list; hockey, baseball, basketball and soccer flag them in the play feed. */
function scoringList(s){
  if (s.scoringPlays && s.scoringPlays.length) return s.scoringPlays;
  const plays = (s.plays || []).filter(x => x.scoringPlay);
  if (plays.length) return plays;
  return (s.keyEvents || []).filter(x => x.scoringPlay);
}
function scoringTab(s, ev){
  const list = scoringList(s);
  if (!list.length) return `<div class="empty">${ev.state === 'pre' ? 'Scoring plays show here once the game starts.' : 'No scoring plays yet.'}</div>`;
  const newest = list.slice().reverse();
  let lastPer = null;
  return newest.map(x => {
    const pn = periodName(ev.lg, x.period);
    const hdr = pn !== lastPer ? `<div class="lbl ghdr">${esc(pn)}</div>` : '';
    lastPer = pn;
    const tm2 = teamOfPlay(x, ev);
    const clock = x.clock && x.clock.displayValue ? x.clock.displayValue : '';
    const kind = (x.scoringType && (x.scoringType.displayName || x.scoringType.name)) || (x.type && x.type.text) || '';
    const sc = x.awayScore !== undefined && x.homeScore !== undefined ? `${esc(ev.away.abbr)} ${esc(x.awayScore)} – ${esc(x.homeScore)} ${esc(ev.home.abbr)}` : '';
    return `${hdr}<div class="lrow" style="align-items:flex-start;gap:10px">${tm2 ? logo(tm2.logo) : '<span class="ph"></span>'}<span class="main" style="flex:1"><span class="lbl">${esc([tm2 && tm2.abbr, kind, clock].filter(Boolean).join(' · '))}</span><span style="font:500 16px/1.35 var(--body)">${esc(x.text || '')}</span>${sc ? `<span style="font:800 16px var(--disp);color:var(--muted)">${sc}</span>` : ''}</span></div>`;

}
function playsTab(s, ev){
  let items = [];
  if (s.plays && s.plays.length){
    items = s.plays.slice(-150).reverse().map(x => ({text: x.text, per: periodName(ev.lg, x.period), clock: x.clock && x.clock.displayValue, scoring: !!x.scoringPlay, team: teamOfPlay(x, ev)}));
  } else if (s.drives && (s.drives.current || s.drives.previous)){
    const drives = (s.drives.previous || []).concat(s.drives.current ? [s.drives.current] : []);
    drives.slice().reverse().forEach(dv => {
      const tm2 = dv.team ? teamOfPlay({team: dv.team}, ev) : null;
      (dv.plays || []).slice().reverse().forEach(x => items.push({text: x.text, per: periodName(ev.lg, x.period), clock: x.clock && x.clock.displayValue, scoring: !!x.scoringPlay, team: tm2}));
    });
  }
  items = items.filter(x => x.text);

  return items.map(x => {

    lastPer = x.per;
    return `${hdr}<div class="lrow" style="align-items:flex-start;${x.scoring ? 'background:var(--green-bg);border-radius:10px;padding-left:8px;padding-right:8px' : ''}"><span class="main"><span class="lbl">${esc([x.team && x.team.abbr, x.clock].filter(Boolean).join(' · '))}${x.scoring ? ' · <span style="color:var(--green-t)">SCORE</span>' : ''}</span><span style="font:500 16px/1.35 var(--body)">${esc(x.text)}</span></span></div>`;
  }).join('');
}
function gameNewsTab(s, ev, p, room){

/* ---------- SPORTS ----------
   Each tile says something: your team's game (live score, tonight's time,
   or the next one this week), how many games are live, or that the sport
   is quiet. Quiet sports drop to the bottom and dim. */
VIEWS.sports = {
  async load(){
    const t = today(), end = addDays(t, 7);
    const info = {};
    await Promise.allSettled(LEAGUES.map(async l => {
      if (l.type !== 'team'){
        const evs = await board(l, t);
        if (evs[0]){
          const st = ((evs[0].status || {}).type || {}).state;
          info[l.key] = {event: evs[0].shortName || evs[0].name, live: st === 'in'};
        }
        return;
      }
      const [day, week] = await Promise.all([board(l, t), board(l, t + '-' + end, null, 300000).catch(() => [])]);
      const n = day.map(e => norm(e, l.key)), w = week.map(e => norm(e, l.key));
      const mine = e => isFav(e);
      const favToday = n.filter(mine).sort(sortEvents)[0];
      const favNext = favToday ? null : w.filter(e => mine(e) && e.state === 'pre' && new Date(e.date) > Date.now()).sort((a, b) => new Date(a.date) - new Date(b.date))[0];
      info[l.key] = {live: n.filter(e => e.state === 'in').length, total: n.length, week: w.length, fav: favToday || favNext || null};
    }));
    return info;
  },
  build(p, info){
    const favLine = (ev) => {
      const f = favOf(ev.home.name, ev.lg) ? ev.home : ev.away, o = f === ev.home ? ev.away : ev.home;
      const vs = (f === ev.home ? 'vs ' : '@ ') + (o.abbr || o.short);
      if (ev.state === 'in') return {cls: 'lv', html: `${liveDot}${esc(f.short)} ${esc(f.score)}–${esc(o.score)} · ${esc(ev.detail)}`};
      if (ev.state === 'post') return {cls: 'fv', html: `${esc(f.short)} ${parseFloat(f.score) > parseFloat(o.score) ? 'W' : parseFloat(f.score) < parseFloat(o.score) ? 'L' : 'T'} ${esc(f.score)}–${esc(o.score)}`};
      const day = ymd(new Date(ev.date)) === today() ? '' : new Date(ev.date).toLocaleDateString(undefined, {weekday: 'short'}) + ' ';
      return {cls: 'fv', html: `${esc(f.short)} · ${esc(day + tm(ev.date))} ${esc(vs)}`};
    };
    const quiet = l => { const c = info[l.key]; return l.type === 'team' ? !(c && (c.total || c.week)) : !(c && c.event); };
    const tile = l => {
      const c = info[l.key] || {};
      const lines = [];
      if (c.fav) lines.push(favLine(c.fav));
      if (l.type === 'team'){
        if (c.live) lines.push({cls: 'lv', html: `${c.fav && c.fav.state === 'in' ? '' : liveDot}${c.live} live${c.total > c.live ? ' · ' + c.total + ' today' : ''}`});
        else if (c.total) lines.push({cls: '', html: `${c.total} game${c.total > 1 ? 's' : ''} today`});
        else if (!c.fav) lines.push({cls: '', html: quiet(l) ? 'No games this week' : 'No games today'});
      } else lines.push(c.event ? {cls: c.live ? 'lv' : '', html: (c.live ? liveDot : '') + esc(c.event)} : {cls: '', html: 'Nothing this week'});
      if (l.sub && lines.length < 2) lines.push({cls: '', html: esc(l.sub)});
      return `<button class="tile ${quiet(l) ? 'off' : ''}" data-h="${h(() => go('league', {lg: l.key, date: today(), mode: 'scores'}))}"><b>${esc(l.name.toUpperCase())}</b>${lines.slice(0, 2).map(x => `<small class="${x.cls}">${x.html}</small>`).join('')}</button>`;
    };
    const order = LEAGUES.filter(l => !quiet(l)).concat(LEAGUES.filter(quiet));
    return `<div class="row" style="margin-top:6px"><h1 class="title">SPORTS</h1></div>
      <div class="grid2" style="margin-top:14px">${order.map(tile).join('')}
      <button class="tile" data-h="${h(() => go('fantasy', {tab: 'mine'}))}"><b>FANTASY</b><small>${S.mfl && S.mfl.franchise ? 'MyFantasyLeague' : 'Connect MFL'}</small></button></div>
      <button class="lrow" style="margin-top:10px" data-h="${h(() => go('myteams'))}"><span class="main"><span style="font:600 17px var(--body)">My teams</span><span class="sub">${esc(S.favs.map(f => f.label || f.name.split(' ').slice(-1)[0]).join(' · '))}</span></span><span style="color:var(--dim);font-size:24px">›</span></button>`;
  }

/* ---------- LEAGUE ---------- */
VIEWS.league = {
  async load(p){
    const l = LG[p.lg];
    if (p.mode === 'standings'){
      let q = '';

      else if (!l.college) q = '?level=' + ({div: 3, conf: 2, league: 1}[p.level || 'div']);

    }
    if (p.mode === 'rankings'){
      const d = await getJSON(`${BASE}${l.path}/rankings`, 600000);
      return {rank: d};
    }

      const c = CFB[p.conf || 'fbs'];
      const parts = await Promise.all(c.g.map(g => board(l, p.date, `groups=${g}&limit=300`)));
      const seen = new Set();
      return {ctx, evs: parts.flat().filter(e => !seen.has(e.id) && seen.add(e.id))};
    }
    const evs = await board(l, p.date);
    return {ctx, evs};
  },

    if (mode === 'standings' && !l.college) html += `<div class="chips sm" style="margin-top:10px">${[['div','Division'],['conf', l.key === 'nfl' ? 'Conference' : l.key === 'mlb' ? 'League' : 'Conference'],['league', 'Overall']].map(([k, t]) => `<button class="chip ${(p.level || 'div') === k ? 'on' : ''}" data-h="${h(() => setP({level: k}))}">${t}</button>`).join('')}</div>`;

    if (mode === 'rankings') return html + rankingsBody(l, d.rank, p, room);

      const evs = d.evs.map(e => norm(e, l.key)).sort(sortEvents);
      gradeEvents(evs);
      const per = perPage(room, 130, 79, 2);

        <div style="margin-top:6px">${pg.items.length ? pg.items.map(ev => gameRow(ev, () => go('game', {lg: ev.lg, path: ev.path, id: ev.id}), d.ctx)).join('') : '<div class="empty">No games on this day.</div>'}</div>
        ${pager(pg.page, pg.pages, n => setP({page: n}))}`;
    }
    if (l.type === 'golf') return html + golfBody(d.evs, p, room);
    if (l.type === 'race') return html + raceBody(d.evs, p, room);

};
function golfBody(evs, p, room){
  const ev = evs[0];

  const comp = (ev.competitions && ev.competitions[0]) || {};

    <div style="margin-top:6px">${pg.items.length ? pg.items.map(row).join('') : '<div class="empty">Leaderboard posts once play starts.</div>'}</div>${pager(pg.page, pg.pages, n => setP({page: n}))}`;
}
function raceBody(evs, p, room){

function tennisBody(evs, p, room){

function rankingsBody(l, d, p, room){

}
function standingsBody(l, d, p){
  let groups = [];
  (function walk(n){
    if (!n) return;
    if (n.standings && n.standings.entries && n.standings.entries.length) groups.push({name: n.name || n.abbreviation || l.name, entries: n.standings.entries});
    (n.children || []).forEach(walk);
  })(d);
  if (l.key === 'cfb'){
    const c = CFB[p.conf || 'fbs'];
    if (c.m) groups = groups.filter(g => c.m.test(g.name) && !(c.k === 'aac' && /mid-american/i.test(g.name)));
  }
  if (!groups.length) return '<div class="empty">Standings not available.</div>';
  const sortFn = l.pts
    ? (a, b) => stat(b, 'points', true) - stat(a, 'points', true) || stat(b, 'winPercent', true) - stat(a, 'winPercent', true)
    : (a, b) => stat(b, 'winPercent', true) - stat(a, 'winPercent', true) || stat(b, 'wins', true) - stat(a, 'wins', true);
  const row = (e, i) => {

    const extra = l.pts ? 'PTS ' + (stat(e, 'points') || '—') : l.college ? (stat(e, 'vs. Conf.') || stat(e, 'vsconf') ? 'Conf ' + (stat(e, 'vs. Conf.') || stat(e, 'vsconf')) : '') : (stat(e, 'gamesBehind') ? 'GB ' + stat(e, 'gamesBehind') : '');
    const fav = favOf(t.displayName, l.key);

    return `<button class="lb" data-h="${h(() => t.id && go('team', {lg: l.key, id: t.id}))}" style="grid-template-columns:30px 1fr auto auto"><span class="p">${i + 1}</span><span class="${fav ? 'fav' : ''}" style="display:flex;align-items:center;gap:8px;font:800 19px var(--disp);min-width:0">${lg2 ? `<img class="logoimg" style="width:22px;height:22px" src="${esc(lg2)}" alt="" loading="lazy">` : ''}<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(t.shortDisplayName || t.displayName || '')}</span></span><span style="font:700 16px var(--body)">${esc(rec)}</span><span class="sub" style="min-width:58px;text-align:right">${esc(extra)}</span></button>`;
  };
  return groups.map(g => `<div class="lbl ghdr">${esc(g.name)}</div><div>${g.entries.slice().sort(sortFn).map(row).join('')}</div>`).join('');
}
function stat(e, name, num){
  const s = (e.stats || []).find(x => x.name === name || x.type === name);
  if (num) return s ? (+s.value || 0) : 0;
  return s ? (s.displayValue ?? s.summary ?? (s.value !== undefined ? String(s.value) : '')) : '';
}

function parseSpread(ev){
  const d = ev.odds.details;
  if (!d) return null;
  if (/^(EVEN|PK|PICK)/i.test(d)) return 0;
  const m = String(d).match(/^(\S+)\s+([+-]?\d+(?:\.\d+)?)/);
  if (!m) return null;
  const val = +m[2];
  if (same(m[1], ev.home.abbr)) return val;
  if (same(m[1], ev.away.abbr)) return -val;
  return null;
}
function prefill(f, ev){
  if (f.type === 'spread'){ const hl = parseSpread(ev); if (hl !== null){ const v = f.side === 'away' ? -hl : hl; f.lineAbs = String(Math.abs(v)); f.lineNeg = v < 0; } f.oddsAbs = '110'; f.oddsNeg = true; }
  else if (f.type === 'total'){ if (ev.odds.ou) f.lineAbs = String(ev.odds.ou); f.lineNeg = false; f.oddsAbs = '110'; f.oddsNeg = true; }
  else if (f.type === 'ml'){ const o = f.side === 'away' ? ev.odds.awayML : ev.odds.homeML; if (o !== undefined && o !== null && !isNaN(+o)){ f.oddsAbs = String(Math.abs(+o)); f.oddsNeg = +o < 0; } }
}
function defaultForm(ev){
  const side = favOf(ev.away.name, ev.lg) && !favOf(ev.home.name, ev.lg) ? 'away' : 'home';
  const f = {type:'spread', side, lineAbs:'', lineNeg:false, oddsAbs:'110', oddsNeg:true, book: S.lastBook, units: 1, prop:''};
  prefill(f, ev);
  return f;
}
function syncForm(f){

  if (g('fLine')) f.lineAbs = g('fLine').value.replace(/[^0-9.]/g, '');
  if (g('fOdds')) f.oddsAbs = g('fOdds').value.replace(/[^0-9]/g, '');

  if (g('fProp')) f.prop = g('fProp').value;
  if (g('fUnits')) { const u = parseFloat(g('fUnits').value); if (u > 0) f.units = u; }
}

/* ---------- NEWS ---------- */
const INJ = /injur|questionable|doubtful|ruled out|out for|day-to-day|\bIR\b|concussion|surgery|activated/i;
const BET = /odds|betting|\bbets?\b|picks?|spread|props?|over\/under|line move|sportsbook|parlay|futures/i;
/* Real news only: drop video clips, highlight packages and auto-generated
   game recaps/previews. ESPN tags those by type; headlines catch the rest. */
const NOT_NEWS = /\bhighlights?\b|\bwatch\b|top plays|best plays|full game|\bclip\b|\bvideo\b|play of the (day|game|night)|\bmixtape\b|\bpostgame\b|\bpress conference\b|\bpresser\b/i;
const NOT_NEWS_TYPES = /media|video|clip|highlight|recap|preview|gamecast|live ?blog|podcast/i;
function realNews(a){
  if (!a || !a.headline) return false;
  if (a.type && NOT_NEWS_TYPES.test(a.type)) return false;
  if (a.video || (a.type || '').toLowerCase() === 'media') return false;
  return !NOT_NEWS.test(a.headline);
}
function newsRow(a){
  return `<button class="news" data-h="${h(() => articleSheet(a))}"><span class="lbl ${a._kind ? 'k-' + a._kind : ''}">${esc(a._label || '')}${a.published ? ' · ' + esc(ago(a.published)) : ''}</span><span class="hl">${esc(a.headline)}</span></button>`;
}
VIEWS.news = {
  async load(p){

    const all = []; let ok = false;
    rs.forEach(r => { if (r.status === 'fulfilled'){ ok = true; all.push(...r.value); } });
    if (!ok && keys.size) throw new Error('The news feed is unreachable');
    const seen = new Set();
    return all.filter(a => realNews(a) && !seen.has(a.headline) && seen.add(a.headline)).sort((a, b) => new Date(b.published || 0) - new Date(a.published || 0));
  },

      const kind = INJ.test(text) ? 'inj' : BET.test(text) ? 'bet' : '';
      return Object.assign(a, {_fav: fav, _kind: kind, _label: (fav ? (fav.label || fav.name) : LG[a._lg].short) + (kind === 'inj' ? ' · Injury' : kind === 'bet' ? ' · Betting' : '')});
    });
    let list = tagged;

    if (f === 'inj') list = tagged.filter(a => a._kind === 'inj');

VIEWS.team = {
  async load(p){
    const l = LG[p.lg];
    const id = p.id || await teamIdFor(p.lg, p.name);
    p.id = id;
    const base = `${BASE}${l.path}/teams/${id}`;
    let power = null;
    if (p.lg === 'nfl' || p.lg === 'cfb'){
      try {
        power = p.lg === 'nfl'
          ? {nfl: true, ratings: await csFile(CS_RATINGS), games: await modelFile('nfl')}
          : {cfb: await modelFile('cfb'), fcs: await csFile(CS_FCS).catch(() => null)};
      } catch (e){ power = {err: e.message}; }
    }
    /* Each ESPN team feed is tried on its own. If one is blocked or down,
       the page falls back to feeds the rest of the app already uses (the
       team list, the scoreboard, league news) instead of failing whole. */
    const [info, sched, roster, news] = await Promise.allSettled([
      getJSON(base, 300000), getJSON(base + '/schedule', 120000), getJSON(base + '/roster', 1800000),
      getJSON(`${BASE}${l.path}/news?team=${id}&limit=25`, 300000)]);
    const missed = [];
    let team = info.status === 'fulfilled' ? (info.value.team || {}) : null;
    if (!team){
      missed.push('team details');
      try {
        const d = await getJSON(`${BASE}${l.path}/teams?limit=1000`, 3600000);
        const list = ((((d.sports || [])[0] || {}).leagues || [])[0] || {}).teams || [];
        team = (list.map(x => x.team).find(x => x && String(x.id) === String(id))) || null;
      } catch (e){}
      if (!team) throw new Error('ESPN\'s team feeds aren\'t loading right now (' + ((info.reason && info.reason.message) || 'blocked') + ')');
    }
    let schedV = sched.status === 'fulfilled' ? sched.value : null;
    if (!schedV || !(schedV.events || []).length){
      if (sched.status !== 'fulfilled') missed.push('full schedule');
      try {
        const t0 = today(), q = l.key === 'cfb' ? 'groups=80&limit=1000' : 'limit=1000';
        const evs = await board(l, addDays(t0, -28) + '-' + addDays(t0, 28), q, 600000);
        const mine = evs.filter(e => ((e.competitions && e.competitions[0] && e.competitions[0].competitors) || []).some(c => c.team && String(c.team.id) === String(id)));
        if (mine.length) schedV = {events: mine.sort((a, b) => new Date(a.date) - new Date(b.date)), partial: true};
      } catch (e){}
    }
    let newsV = news.status === 'fulfilled' ? news.value : null;
    if (!newsV){
      try {
        const d = await getJSON(`${BASE}${l.path}/news?limit=50`, 120000);
        const nm = team.displayName || '';
        newsV = {articles: (d.articles || []).filter(a => (a.categories || []).some(c => String((c.team && c.team.id) || c.teamId || '') === String(id) || same(c.description, nm)) || String(a.headline || '').includes(team.shortDisplayName || team.name || '~'))};
      } catch (e){}
    }
    if (roster.status !== 'fulfilled') missed.push('roster');
    return {power, missed, t: team, sched: schedV, roster: roster.status === 'fulfilled' ? roster.value : null, news: newsV};
  },
  build(p, d){
    const l = LG[p.lg], t = d.t;
    const hasPower = !!d.power;
    const tab = p.tab || (hasPower ? 'power' : 'schedule');
    const rec = ((t.record && t.record.items) || []).find(x => x.type === 'total') || ((t.record && t.record.items) || [])[0];
    const fav = favOf(t.displayName, p.lg);
    const lg2 = (t.logos && t.logos[0] && t.logos[0].href) || '';
    const favBtn = `<button class="chip ${fav ? 'on' : ''}" data-h="${h(() => {
      if (fav){ if (confirm('Remove ' + (fav.label || fav.name) + ' from My Teams?')){ fav.lg = fav.lg.filter(k => k !== p.lg); if (!fav.lg.length) S.favs = S.favs.filter(x => x !== fav); save(); render(true); } }
      else { addTeam({displayName: t.displayName, logos: t.logos}, p.lg, true); render(true); }
    })}">${fav ? '★ My team' : '☆ Add to My Teams'}</button>`;
    const sportChips = (p.lgs || []).length > 1 ? `<div class="chips sm">${p.lgs.map(k => `<button class="chip ${k === p.lg ? 'on' : ''}" data-h="${h(() => setP({lg: k, id: null, tab: 'schedule'}))}">${esc(LG[k].sport || LG[k].short)}</button>`).join('')}</div>` : '';
    const seg = (k, lbl) => `<button class="${tab === k ? 'on' : ''}" data-h="${h(() => setP({tab: k}))}">${lbl}</button>`;
    let html = `<div class="thead">${logo(lg2)}<div style="min-width:0"><h1 class="title" style="font-size:30px">${esc(String(t.displayName || '').toUpperCase())}</h1><div class="sub" style="font-weight:600;margin-top:3px">${esc([rec && rec.summary, t.standingSummary].filter(Boolean).join(' · '))}</div><div style="margin-top:8px">${favBtn}</div></div></div>
      ${sportChips}
      <div class="seg stick" style="margin-top:${sportChips ? 10 : 0}px">${hasPower ? seg('power', 'POWER') : ''}${seg('schedule', 'SCHEDULE')}${seg('roster', 'ROSTER')}${seg('inj', 'INJURIES')}${seg('news', 'NEWS')}</div><div style="display:flex;flex-direction:column;gap:12px;margin-top:10px">`;
    if (tab === 'power') html += p.lg === 'nfl' ? nflPowerPage(d.power, t) : cfbPowerPage(d.power, t);
    if (tab === 'schedule') html += teamSchedule(d, p, t);
    if (tab === 'roster') html += teamRoster(d, false);
    if (tab === 'inj') html += teamRoster(d, true);
    if (tab === 'news'){
      const arts = ((d.news && d.news.articles) || []).filter(realNews);
      html += arts.length ? '<div>' + arts.map(a => newsRow(Object.assign(a, {_label: t.shortDisplayName || l.short, _kind: INJ.test(a.headline + ' ' + (a.description || '')) ? 'inj' : ''}))).join('') + '</div>' : '<div class="empty">No recent stories.</div>';
    }
    if ((d.missed || []).length) html += `<div class="sub" style="margin-top:4px">Couldn't load from ESPN: ${esc(d.missed.join(', '))}.</div>`;
    return html + '</div>';
  }
};
/* ---------- Call Sheet power, on team pages ----------

const sg1 = v => { if (v === null || v === undefined || isNaN(v)) return '—'; const r = Math.round(v * 10) / 10; return r === 0 ? '0.0' : (r > 0 ? '+' : '−') + Math.abs(r).toFixed(1); };

  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:${h}px" role="img" aria-label="Rating by week"><line x1="6" x2="${w - 6}" y1="${Y(0)}" y2="${Y(0)}" stroke="var(--silver)" stroke-dasharray="3 3"/><polyline points="${vals.map((v, i) => X(i).toFixed(1) + ',' + Y(v).toFixed(1)).join(' ')}" fill="none" stroke="var(--blue)" stroke-width="2.5"/>${vals.map((v, i) => `<circle cx="${X(i).toFixed(1)}" cy="${Y(v).toFixed(1)}" r="3" fill="var(--blue)"/>`).join('')}</svg>`;
}
const statTile = (n, l) => `<div class="stat"><span class="lbl">${l}</span><b style="font-size:24px">${n}</b></div>`;
function cfbFind(file, t){

}
function cfbPowerPage(P, t){

function nflPowerPage(P, t){

    const myModel = mdl === null ? null : (home ? -mdl : mdl);

  return groups.filter(g => g.items.length).map(g => `${g.name ? `<div class="lbl ghdr">${esc(title(g.name))}</div>` : ''}<div>${g.items.slice().sort((a, b) => posRank(a) - posRank(b) || (+a.jersey || 0) - (+b.jersey || 0)).map(a => {
    const st = injOf(a);
    return `<div class="lrow" style="padding:8px 2px"><span style="display:flex;align-items:center;gap:10px;min-width:0"><span style="width:34px;font:800 18px var(--disp);color:var(--muted);flex:none">${a.jersey ? '#' + esc(a.jersey) : ''}</span><span class="main"><span style="font:700 16px var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(a.displayName || a.fullName || '')}</span><span class="sub">${esc((a.position && a.position.abbreviation) || '')}</span></span></span>${st ? `<span class="tag ${INJ_RANK(st) === 0 ? 'down' : 'even'}">${esc(st)}</span>` : ''}</div>`;
  }).join('')}</div>`).join('');
}

/* ---------- MY TEAMS ---------- */
VIEWS.myteams = {
  build(p, _, avail){
    const per = perPage(avail, 200, 64, 3);
    const pg = slicePage(S.favs, per, p.page);
    const row = fv => {
      const sub = fv.college ? fv.lg.map(k => LG[k] && LG[k].sport).filter(Boolean).join(' · ') : fv.lg.map(k => LG[k] && LG[k].short).join(' · ');
      return `<div class="lrow" style="padding:8px 2px">
        <span style="display:flex;align-items:center;gap:12px;min-width:0">${logo(fv.logo)}<span class="main"><button class="tlink" data-h="${h(() => go('team', {lg: fv.lg[0], name: fv.name, lgs: fv.lg}))}">${esc(fv.label || fv.name)} <span style="color:var(--dim);font-size:20px">›</span></button>${fv.college ? `<button class="back" style="min-height:28px;font-size:14px" data-h="${h(() => sportsSheet(fv))}">${esc(sub)} · Edit sports ›</button>` : `<span class="sub">${esc(sub)}</span>`}</span></span>
        <button aria-label="Remove ${esc(fv.label || fv.name)}" style="width:44px;height:44px;border:0;background:none;color:var(--dim);font-size:24px" data-h="${h(() => { if (confirm('Remove ' + (fv.label || fv.name) + '?')){ S.favs = S.favs.filter(x => x !== fv); save(); render(); } })}">×</button>
      </div>`;
    };
    return `<div class="row"><h1 class="title">MY TEAMS</h1><span class="sub">These fill Tonight</span></div>
      <div style="margin-top:8px">${pg.items.length ? pg.items.map(row).join('') : '<div class="empty">No teams yet.</div>'}</div>
      ${pager(pg.page, pg.pages, n => setP({page: n}))}
      <button class="bigbtn" style="margin-top:14px" data-h="${h(() => go('addteam', {lg: 'nfl', q: ''}))}"><span class="plus">+</span>Add a team</button>`;
  }
};
function sportsSheet(fv){
  const draw = () => {
    openSheet(`<h2>${esc(fv.label || fv.name)}</h2><div class="sub">Which sports should show on Tonight?</div>
      ${COLLEGE_LGS.map(l => `<div class="toggle"><span>${esc(l.sport.toUpperCase())}</span><button data-k="${l.key}" class="${fv.lg.includes(l.key) ? 'on' : ''}">${fv.lg.includes(l.key) ? 'ON' : 'OFF'}</button></div>`).join('')}
      <button class="bigbtn" id="doneBtn">Done</button>`);
    document.querySelectorAll('#sheetBody .toggle button').forEach(b => b.onclick = () => {
      const k = b.dataset.k;
      fv.lg = fv.lg.includes(k) ? fv.lg.filter(x => x !== k) : fv.lg.concat(k);
      save(); draw();
    });
    $('#doneBtn').onclick = () => { closeSheet(); render(); };
  };
  draw();
}

/* ---------- ADD TEAM ---------- */
VIEWS.addteam = {
  async load(p){
    const l = LG[p.lg];
    const d = await getJSON(`${BASE}${l.path}/teams?limit=1000`, 3600000);
    const teams = (((d.sports || [])[0] || {}).leagues || [])[0];
    return ((teams && teams.teams) || []).map(t => t.team).filter(Boolean).sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));
  },
  build(p, teams){
    const lchip = l => `<button class="chip ${p.lg === l.key ? 'on' : ''}" data-h="${h(() => setP({lg: l.key}))}">${esc(l.short)}</button>`;
    return `<h1 class="title">ADD A TEAM</h1>
      <div class="chips" style="margin-top:12px">${TEAM_LGS.map(lchip).join('')}</div>
      <input id="teamQ" style="margin-top:12px;flex:none" placeholder="Search ${esc(LG[p.lg].name)} teams" value="${esc(p.q || '')}" autocomplete="off">
      <div id="teamRes" style="margin-top:4px"></div>`;
  },
  after(p, teams){
    const box = $('#teamRes'), inp = $('#teamQ');
    const draw = () => {
      const q = (inp.value || '').trim().toLowerCase();
      p.q = inp.value;
      const hits = (q ? teams.filter(t => (t.displayName + ' ' + (t.abbreviation || '') + ' ' + (t.location || '')).toLowerCase().includes(q)) : teams).slice(0, 6);
      box.innerHTML = hits.length ? hits.map(t => {
        const have = S.favs.some(f => same(f.name, t.displayName) && f.lg.includes(p.lg));
        const lg2 = t.logos && t.logos[0] && t.logos[0].href;
        return `<button class="lrow" ${have ? 'disabled' : ''} data-h="${h(() => addTeam(t, p.lg))}"><span style="display:flex;align-items:center;gap:12px;min-width:0">${logo(lg2)}<span class="big" style="font-size:21px">${esc(t.displayName)}</span></span><span class="tag ${have ? 'push' : 'my'}">${have ? 'ADDED' : '+ ADD'}</span></button>`;
      }).join('') + (!q && teams.length > 6 ? '<div class="sub" style="margin-top:8px">Type to search all teams.</div>' : '') : '<div class="empty">No match.</div>';
    };
    inp.addEventListener('input', draw);
    draw();
  }
};
function addTeam(t, lgKey, stay){
  const l = LG[lgKey];
  const existing = l.college && S.favs.find(f => f.college && same(f.name, t.displayName));
  if (existing){ if (!existing.lg.includes(lgKey)) existing.lg.push(lgKey); }
  else S.favs.push({name: t.displayName, lg: [lgKey], college: !!l.college, logo: (t.logos && t.logos[0] && t.logos[0].href) || ''});
  save();
  if (!stay) back();
}

/* ---------- SETTINGS ---------- */
VIEWS.settings = {
  build(){
    return `<h1 class="title">SETTINGS</h1>
            <div class="field" style="margin-top:12px"><span class="lbl">Appearance</span><div class="chips">${[['light','Light'],['dark','Dark'],['auto','Match phone']].map(([k, l]) => `<button class="chip ${S.theme === k ? 'on' : ''}" data-h="${h(() => { S.theme = k; save(); applyTheme(); render(true); })}">${l}</button>`).join('')}</div></div>
      <div class="field" style="margin-top:14px"><span class="lbl">Fantasy card on Tonight</span><div class="chips">${[['bottom', 'Bottom'], ['top', 'Top'], ['gameday', 'Top on Sun & Mon']].map(([k, l]) => `<button class="chip ${S.fantasyPos === k ? 'on' : ''}" data-h="${h(() => { S.fantasyPos = k; save(); render(true); })}">${l}</button>`).join('')}</div></div>
      <div class="field" style="margin-top:14px"><span class="lbl">Scores bubbles on Tonight</span><div class="sub">Turn bubbles on or off and use the arrows to set the order. "Other" holds every league not on its own bubble.</div>
        <div>${(() => {
          const on = S.bubbles.filter(id => BUBBLES[id]);
          const all = on.concat(BUBBLE_ORDER.filter(id => !on.includes(id)));
          const move = (id, dir) => { const i = S.bubbles.indexOf(id), j = i + dir; if (i < 0 || j < 0 || j >= S.bubbles.length) return; const a = S.bubbles.slice(); [a[i], a[j]] = [a[j], a[i]]; S.bubbles = a; save(); render(true); };
          return all.map(id => {
            const isOn = on.includes(id), i = on.indexOf(id);
            return `<div class="ordrow"><span>${esc(BUBBLES[id].label)}${id === 'college' ? ' <small class="sub">FB · BB · Hockey</small>' : ''}</span>
              <button class="mv" aria-label="Move up" ${!isOn || i === 0 ? 'disabled' : ''} data-h="${h(() => move(id, -1))}">▲</button>
              <button class="mv" aria-label="Move down" ${!isOn || i === on.length - 1 ? 'disabled' : ''} data-h="${h(() => move(id, 1))}">▼</button>
              <button class="tg ${isOn ? 'on' : ''}" data-h="${h(() => { S.bubbles = isOn ? S.bubbles.filter(x => x !== id) : S.bubbles.concat(id); save(); render(true); })}">${isOn ? 'ON' : 'OFF'}</button></div>`;
          }).join('');
        })()}</div></div>
      <button class="ghost" style="margin-top:14px" data-h="${h(() => go('mflsetup'))}">Fantasy league (MFL) ›</button>
      <div class="field" style="margin-top:14px"><label class="lbl" for="ghIn">Fantasy refresh key (GitHub)</label>
        <div class="sub">${S.ghToken ? 'Saved on this phone. The Refresh button on Fantasy uses it.' : 'Lets the Refresh button on Fantasy update your league right away.'}</div>
        <div class="row"><input id="ghIn" type="password" autocomplete="off" placeholder="${S.ghToken ? '•••••••• saved' : 'Paste key (github_pat_…)'}"><button class="chip on" style="height:48px" data-h="${h(() => { const v = $('#ghIn').value.trim(); if (!v) return; S.ghToken = v; save(); alert('Saved.'); render(); })}">Save</button></div>
        <div class="row" style="justify-content:flex-start;gap:18px"><button class="linkbtn" data-h="${h(ghKeySheet)}">How to make one ›</button>${S.ghToken ? `<button class="linkbtn" style="color:var(--red)" data-h="${h(() => { if (confirm('Remove the refresh key from this phone?')){ S.ghToken = ''; save(); render(); } })}">Remove key</button>` : ''}</div>
      </div>
      <div class="field" style="margin-top:14px"><label class="lbl" for="unitIn">Unit size ($)</label><div class="row"><input id="unitIn" inputmode="decimal" value="${esc(S.unit)}"><button class="chip on" style="height:48px" data-h="${h(() => { const v = parseFloat($('#unitIn').value); if (v > 0){ S.unit = v; save(); back(); } })}">Save</button></div></div>
      <div class="field" style="margin-top:18px"><span class="lbl">Backup</span><div class="sub">Copy this to move your teams and bets to another phone.</div>
        <button class="ghost" data-h="${h(() => { const t = JSON.stringify({favs: S.favs, bets: S.bets, unit: S.unit}); (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => alert('Copied.'), () => { $('#ioWrap').hidden = false; $('#ioBox').value = t; }); })}">Copy backup</button>
        <button class="linkbtn" data-h="${h(() => { $('#ioWrap').hidden = false; $('#ioBox').focus(); })}">Restore from a backup…</button>
        <div id="ioWrap" class="field" hidden><textarea id="ioBox" placeholder="Paste a backup here to restore"></textarea>
        <button class="ghost" data-h="${h(() => { try { const d = JSON.parse($('#ioBox').value); if (!Array.isArray(d.favs) || !Array.isArray(d.bets)) throw 0; if (confirm('Replace your teams and bets with this backup?')){ S.favs = d.favs; S.bets = d.bets; if (d.unit) S.unit = d.unit; save(); alert('Restored.'); back(); } } catch(e){ alert("That doesn't look like a SportsMF backup."); } })}">Restore backup</button></div>
      </div>

      <div class="toggle" style="margin-top:12px"><span>Call Sheet bets in SportsMF</span><button class="${S.showCS ? 'on' : ''}" data-h="${h(() => { S.showCS = !S.showCS; save(); render(); })}">${S.showCS ? 'ON' : 'OFF'}</button></div>
      <button class="ghost" style="margin-top:18px" data-h="${h(() => { if (confirm('Reset My Teams to the default list?')){ S.favs = JSON.parse(JSON.stringify(DEFAULT_FAVS)); save(); back(); } })}">Reset My Teams</button>
      <div class="sub" style="margin-top:14px">Scores, lines and news from ESPN's public feeds. NFL props from your Call Sheet odds pull.<br>Build ${esc(BUILD)}</div>`;
  }
};

/* ================= THEME ================= */
const darkQ = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
function applyTheme(){
  const dark = S.theme === 'dark' || (S.theme === 'auto' && darkQ && darkQ.matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light';
  const m = document.querySelector('meta[name="theme-color"]');
  if (m) m.setAttribute('content', dark ? '#0D0F12' : '#FFFFFF');
}
if (darkQ && darkQ.addEventListener) darkQ.addEventListener('change', () => { if (S.theme === 'auto') applyTheme(); });
applyTheme();

/* ================= BOOT ================= */
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => tab(b.dataset.tab)));
$('#logoBtn').addEventListener('click', () => tab('tonight'));
$('#gearBtn').addEventListener('click', () => go('settings'));
$('#navBack').addEventListener('click', () => { const V = VIEWS[cur().name]; if (V && V.back) V.back(cur().p); else back(); });
$('#view').addEventListener('scroll', updPast, {passive: true});
/* "Updated 12s ago" lines tick on their own. */
setInterval(() => document.querySelectorAll('#view .upd[data-ts]').forEach(el => {
  const extra = el.textContent.split(' · ').slice(1).join(' · ');
  el.textContent = updText(+el.dataset.ts) + (extra ? ' · ' + extra : '');
}), 1000);
/* Pull down to refresh on any screen that shows scores or bets. */
(function(){
  const v = $('#view'), ptr = $('#ptr'), lab = ptr.querySelector('span');
  const ok = () => ['tonight', 'game', 'league', 'bets', 'sports', 'news', 'fantasy'].includes(cur().name) && $('#sheet').hidden;
  let y0 = null, dy = 0, busy = false;
  v.addEventListener('touchstart', e => { if (!busy && v.scrollTop <= 0 && ok()){ y0 = e.touches[0].clientY; dy = 0; } else y0 = null; }, {passive: true});
  v.addEventListener('touchmove', e => {
    if (y0 === null) return;
    dy = e.touches[0].clientY - y0;
    if (dy <= 0 || v.scrollTop > 0){ ptr.style.height = '0'; return; }
    ptr.style.height = Math.min(dy * 0.5, 56) + 'px';
    lab.textContent = dy > 110 ? 'Release to refresh' : 'Pull to refresh';
  }, {passive: true});
  v.addEventListener('touchend', async () => {
    if (y0 === null) return;
    y0 = null;
    if (dy > 110){
      busy = true; ptr.style.height = '36px'; lab.textContent = 'Refreshing…';
      mem.clear(); _cs = {t: 0, v: []};
      try { await render(true); } finally { busy = false; ptr.style.height = '0'; }
    } else ptr.style.height = '0';
  });
})();
function setDate(){ $('#todayLbl').textContent = new Date().toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'}).replace(',', ' ·'); }
setDate();
let tick = 0;
setInterval(() => {
  tick++;
  if (document.hidden || !$('#sheet').hidden) return;
  const c = cur(), n = c.name;
  /* Live pitch tracker: every 10 seconds. Everything else: every 30. */
  const pitchLive = n === 'game' && c.p.lg === 'mlb' && (!c.p.tab || c.p.tab === 'pitches') && c.p.ab === undefined && document.querySelector('#view .mlbsit');
  if (pitchLive){ render(true); return; }
  if (tick % 3) return;
  setDate();
  if (['tonight', 'game', 'league'].includes(n)) render(true);
}, 10000);
/* Re-read Call Sheet data whenever it could have changed: coming back to
   this tab or app, Safari restoring the page, or the Call Sheet saving
   while both are open (the 'storage' event fires in this tab then). */
const FORM_VIEWS = ['addbet', 'addteam', 'settings', 'mflsetup'];
function refreshFromCS(){ _cs = {t: 0, v: []}; if (!FORM_VIEWS.includes(cur().name) && $('#sheet').hidden) render(true); }
document.addEventListener('visibilitychange', () => { if (!document.hidden) refreshFromCS(); });
window.addEventListener('pageshow', e => { if (e.persisted) refreshFromCS(); });
window.addEventListener('focus', refreshFromCS);
window.addEventListener('storage', e => { if (!e.key || e.key === CS_KEY) refreshFromCS(); });
let rT; window.addEventListener('resize', () => { clearTimeout(rT); rT = setTimeout(() => render(true), 250); });
/* Home-screen apps on iOS can hang on to an old copy of this page. On each
   open, re-read this same file from the site and offer a reload if it has
   a newer build stamp. Silent if offline. */
async function checkBuild(){
  try {
    const r = await fetch(location.pathname + '?v=' + Date.now(), {cache: 'no-store'});
    if (!r.ok) return;
    const m = (await r.text()).match(/const BUILD = '([^']+)'/);
    if (!m || m[1] === BUILD) return;
    const bar = document.createElement('button');
    bar.className = 'bigbtn blue';
    bar.style.cssText = 'position:fixed;left:16px;right:16px;bottom:calc(76px + env(safe-area-inset-bottom));width:auto;z-index:30';
    bar.textContent = 'New version ready · tap to reload';
    bar.onclick = () => { location.href = location.pathname + '?_=' + Date.now(); };
    document.body.appendChild(bar);
  } catch (e){}
}
render();
checkBuild();
</script>
</body>
